<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MILES Desktop Build 006</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#0b1220;color:#e8eefc;margin:0}.wrap{max-width:1220px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.badge{padding:6px 10px;border-radius:999px;background:#17345c;color:#9fd3ff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#111b2e;border:1px solid #263955;border-radius:14px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.25)}h1,h2,h3{margin:0 0 12px}.big{font-size:34px;font-weight:700}.good{color:#43d17a}.warn{color:#ffd166}.bad{color:#ff6b6b}.muted{color:#9fb0cc}.section{margin-top:18px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #24334d;padding:9px 0}.pill{padding:4px 8px;border-radius:8px;background:#223756}.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}button{background:#2a72ff;color:white;border:0;border-radius:8px;padding:8px 10px;cursor:pointer}button.secondary{background:#33445f}textarea,input{width:100%;background:#0c1424;color:#e8eefc;border:1px solid #31425f;border-radius:8px;padding:10px}.nav button{margin-right:8px;margin-bottom:8px}.hidden{display:none}pre{white-space:pre-wrap;background:#07101f;border-radius:10px;padding:12px;max-height:420px;overflow:auto}.table{width:100%;border-collapse:collapse}.table td,.table th{border-bottom:1px solid #273954;padding:8px;text-align:left}.chat{display:flex;gap:8px}.chat input{flex:1}.message{margin-top:10px;padding:10px;border-radius:10px;background:#0c1424}
</style></head><body><div class="wrap">
<div class="top"><div><h1>MILES Desktop</h1><div class="muted">Build 006 — Outbound Operations Department</div></div><div class="badge" id="build">Loading</div></div>
<div class="nav section"><button onclick="show('home')">Home</button><button onclick="show('outbound')">Outbound</button><button onclick="show('approvals')">Approvals</button><button onclick="show('workforce')">AI Workforce</button><button onclick="show('development')">Development</button><button onclick="show('chat')">Executive Chat</button></div>
<section id="home" class="section"></section>
<section id="outbound" class="section hidden"></section>
<section id="approvals" class="section hidden"></section>
<section id="workforce" class="section hidden"></section>
<section id="development" class="section hidden"></section>
<section id="chat" class="section hidden"></section>
</div><script>
let state={};
function cls(h){return h==='Healthy'?'good':(h==='Warning'||h==='Pending'?'warn':'bad')}
async function load(){ state=await (await fetch('/api/status')).json(); render(); }
function show(id){ for(const s of document.querySelectorAll('section')) s.classList.add('hidden'); document.getElementById(id).classList.remove('hidden'); }
function render(){document.getElementById('build').textContent=state.build+' • '+state.runtime;
 const out=state.outbound;
 document.getElementById('home').innerHTML=`<div class="card"><h2>Good ${new Date().getHours()<12?'morning':'afternoon'} Kevin</h2><p class="muted">MILES is running and Outbound Operations is now live.</p><div class="grid"><div class="card"><div class="muted">Business Health</div><div class="big ${out.health==='Healthy'?'good':'warn'}">${state.businessHealth}%</div></div><div class="card"><div class="muted">Outbound Health</div><div class="big ${cls(out.health)}">${out.health}</div></div><div class="card"><div class="muted">Daily Capacity</div><div class="big">${out.dailyCapacity}</div></div><div class="card"><div class="muted">CEO Approvals</div><div class="big warn">${state.approvals.length}</div></div></div></div><div class="two section"><div class="card"><h3>Today's Priorities</h3>${out.topActions.slice(0,6).map((a,i)=>`<div class="row"><span>${i+1}. ${a.Area}: ${a.Item}</span><span class="pill">${a.Priority}</span></div><div class="muted">${a.Action}</div>`).join('')}</div><div class="card"><h3>Departments</h3>${state.departments.map(d=>`<div class="row"><span>${d.name}</span><span class="${cls(d.health)}">${d.health}</span></div>`).join('')}</div></div>`;
 document.getElementById('outbound').innerHTML=`<div class="grid"><div class="card"><div class="muted">Domains</div><div class="big">${out.domains}</div></div><div class="card"><div class="muted">Active Inboxes</div><div class="big good">${out.activeInboxes}</div></div><div class="card"><div class="muted">Planned Inboxes</div><div class="big warn">${out.plannedInboxes}</div></div><div class="card"><div class="muted">Campaigns</div><div class="big">${out.campaigns}</div></div></div><div class="card section"><h2>Outbound Next Actions</h2><table class="table"><tr><th>Priority</th><th>Area</th><th>Item</th><th>Action</th></tr>${out.topActions.map(a=>`<tr><td>${a.Priority}</td><td>${a.Area}</td><td>${a.Item}</td><td>${a.Action}</td></tr>`).join('')}</table></div><div class="card section"><h3>Safety Rule</h3><p><b>pathways2gc.com</b> remains protected and excluded from outbound campaigns. Admin status: ${out.protectedAdmin}.</p></div>`;
 document.getElementById('approvals').innerHTML=`<div class="card"><h2>CEO Approval Center</h2>${state.approvals.map(a=>`<div class="card section"><h3>${a.id} — ${a.title}</h3><p><b>Department:</b> ${a.department}</p><p><b>Status:</b> ${a.status}</p><p><b>MILES Recommendation:</b> ${a.recommendation}</p><textarea id="c_${a.id}" placeholder="Request changes or approval notes"></textarea><br><br><button onclick="decision('${a.id}','approve')">Approve</button> <button class="secondary" onclick="decision('${a.id}','changes')">Request Changes</button> <button class="secondary" onclick="decision('${a.id}','reject')">Reject</button><div id="r_${a.id}" class="muted"></div></div>`).join('')}</div>`;
 document.getElementById('workforce').innerHTML=`<div class="card"><h2>AI Workforce Center</h2><table class="table"><tr><th>Twin</th><th>Role</th><th>Current Task</th><th>Status</th><th>Health</th></tr>${state.workforce.map(w=>`<tr><td>${w.name}</td><td>${w.role}</td><td>${w.currentTask}</td><td>${w.status}</td><td class="good">${w.health}</td></tr>`).join('')}</table></div>`;
 document.getElementById('development').innerHTML=`<div class="card"><h2>Development Center</h2><div class="row"><span>Current Build</span><span>${state.build}</span></div><div class="row"><span>Completed</span><span>Executive Layer, Outbound Registry Engine</span></div><div class="row"><span>Active Department</span><span>Outbound Operations</span></div><div class="row"><span>Next Build</span><span>Sales Operations</span></div><div class="row"><span>Blockers</span><span class="good">None</span></div></div>`;
 document.getElementById('chat').innerHTML=`<div class="card"><h2>Executive Chat</h2><div class="chat"><input id="cmd" placeholder="Ask: what needs my attention, outbound status, workforce status"><button onclick="chat()">Send</button></div><div id="chatOut" class="message muted">Ready.</div></div>`;
}
async function decision(id,decision){const comment=document.getElementById('c_'+id).value; const res=await (await fetch('/api/approvals/'+id+'/'+decision,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({comment})})).json(); document.getElementById('r_'+id).textContent='Recorded '+res.decision+' at '+res.recordedAt;}
function chat(){const cmd=document.getElementById('cmd').value.toLowerCase(); let msg='I can answer runtime, outbound, workforce, approvals, and priorities.'; if(cmd.includes('attention')||cmd.includes('priorit')) msg=state.outbound.topActions.slice(0,6).map((a,i)=>`${i+1}. ${a.Priority} ${a.Area}: ${a.Item} — ${a.Action}`).join('\n'); if(cmd.includes('outbound')) msg=`Outbound is ${state.outbound.health}. ${state.outbound.activeInboxes} active inboxes, ${state.outbound.plannedInboxes} planned inboxes, ${state.outbound.dailyCapacity}/day capacity, ${state.outbound.campaigns} campaigns.`; if(cmd.includes('workforce')) msg=`${state.workforce.length} AI workers registered. MILES is managing the workforce. No workers blocked.`; if(cmd.includes('approval')) msg=`${state.approvals.length} CEO approvals waiting.`; document.getElementById('chatOut').textContent=msg;}
load(); setInterval(load,15000);
</script></body></html>
