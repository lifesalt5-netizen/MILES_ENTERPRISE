<!doctype html><html><head><meta charset="utf-8"><title>MILES Sales Operations</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:#e5e7eb;margin:0;padding:24px}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.metric{font-size:34px;font-weight:700}.label{color:#94a3b8}.ok{color:#22c55e}.warn{color:#f59e0b}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #334155;padding:10px;text-align:left}a{color:#93c5fd}</style></head><body><h1>Build 007 — Sales Operations Department</h1><p class="label">CRM, pipeline, proposals, follow-ups, and CEO sales actions.</p><div class="grid"><div class="card"><div class="label">Sales Health</div><div id="health" class="metric ok">Loading</div></div><div class="card"><div class="label">Active Opportunities</div><div id="opps" class="metric">-</div></div><div class="card"><div class="label">Pipeline Value</div><div id="pipeline" class="metric">-</div></div><div class="card"><div class="label">Follow-ups Due</div><div id="followups" class="metric">-</div></div><div class="card"><div class="label">Stalled Opportunities</div><div id="stalled" class="metric">-</div></div></div><div class="card"><h2>CEO Sales Actions</h2><ul id="actions"></ul></div><div class="card"><h2>Next Sales Tasks</h2><table><thead><tr><th>Company</th><th>Priority</th><th>Due</th><th>Action</th></tr></thead><tbody id="tasks"></tbody></table></div><p><a href="/">Back to MILES Home</a></p><script>async function load(){try{let r=await fetch('/api/sales/report');let d=await r.json();health.textContent=d.health;health.className='metric '+(d.health==='Healthy'?'ok':'warn');opps.textContent=d.activeOpportunities;pipeline.textContent='$'+Number(d.pipelineValue).toLocaleString();followups.textContent=d.followUpsDue;stalled.textContent=d.stalledOpportunities;actions.innerHTML=(d.ceoActions||[]).map(x=>'<li>'+x+'</li>').join('')||'<li>No CEO sales actions pending.</li>';tasks.innerHTML=(d.nextActions||[]).map(t=>`<tr><td>${t.Company}</td><td>${t.Priority}</td><td>${t['Due Date']}</td><td>${t.Action}</td></tr>`).join('')}catch(e){document.body.insertAdjacentHTML('beforeend','<pre>'+e.message+'</pre>')}}load()</script></body></html>
