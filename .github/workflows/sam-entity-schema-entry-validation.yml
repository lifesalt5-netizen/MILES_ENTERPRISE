name: SAM Entity Schema Entry Validation
on:
  push:
    branches:
      - 'fix/sam-entity-schema-entry-inspection-20260830'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check SCRIPTS/InspectSamBulkSchema.js
      - run: |
          grep -q "selectedEntry" SCRIPTS/InspectSamBulkSchema.js
          grep -q "archiveExtracted:false" SCRIPTS/InspectSamBulkSchema.js
          grep -q "parseDelimitedHeader" SCRIPTS/InspectSamBulkSchema.js
