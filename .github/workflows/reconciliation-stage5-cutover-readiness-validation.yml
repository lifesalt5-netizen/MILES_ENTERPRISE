name: MILES Reconciliation Stage 5 Cutover Readiness Validation

on:
  pull_request:
    paths:
      - "SCRIPTS/AUDIT_MILES_CUTOVER_READINESS.ps1"
      - "TESTS/reconciliation_stage5_cutover_readiness_safety_test.js"
      - ".github/workflows/reconciliation-stage5-cutover-readiness-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Static safety validation
        run: node TESTS/reconciliation_stage5_cutover_readiness_safety_test.js
