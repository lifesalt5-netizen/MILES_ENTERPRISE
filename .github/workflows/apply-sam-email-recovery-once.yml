name: Apply SAM Email Recovery Once
on:
  push:
    branches:
      - 'feature/sam-email-recovery-20260830'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sam-email-recovery-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check SERVICES/orion/SamEmailRecoveryService.js
      - run: node --check SCRIPTS/RecoverSamQualifiedEmails.js
      - run: node TESTS/sam_email_recovery.test.js
      - run: node SCRIPTS/RepairSamEmailRecoveryBridge.js
      - run: node SCRIPTS/RepairSamEmailRecoveryBridge.js --apply
      - run: |
          node --check StartMilesRemoteExecutionBridge.js
          grep -q "SAM_EMAIL_RECOVERY" StartMilesRemoteExecutionBridge.js
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js
          if git diff --cached --quiet; then echo 'No source changes required.'; else git commit -m 'Allow remote SAM email recovery'; git push origin HEAD:feature/sam-email-recovery-20260830; fi
