name: MILES Recovery Static Validation

on:
  push:
    branches:
      - agent/miles-full-system-reconciliation-20260815
  workflow_dispatch:

concurrency:
  group: miles-recovery-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Parse PowerShell recovery scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'SCRIPTS\RunMilesEndToEndBootstrap.ps1',
            'SCRIPTS\RunApprovedMilesEndToEndFinal.ps1',
            'SCRIPTS\RunApprovedMilesFullSystemReconciliation.ps1'
          )
          foreach ($file in $files) {
            [void][scriptblock]::Create((Get-Content $file -Raw))
            Write-Host "[POWERSHELL PARSE OK] $file"
          }

      - name: Node syntax gates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'SCRIPTS\ReconcilePm2Process.js',
            'SCRIPTS\Pm2DirectCommand.js',
            'SCRIPTS\TestReconcilePm2ProcessUnit.js',
            'SCRIPTS\TestReconcilePm2ProcessIntegration.js',
            'SCRIPTS\ReconcileMilesProductionSurfaces.js',
            'SCRIPTS\MilesProductionGuardian.js',
            'SCRIPTS\MilesEphemeralExecutor.js',
            'SCRIPTS\TestMilesFinalSurfaceAcceptanceP0.js',
            'SCRIPTS\RunMilesAcceptanceWithLiveMemory.js',
            'SCRIPTS\TestMilesProductionRecoveryAcceptanceP0.js',
            'SCRIPTS\TestMilesRevenueConnectorAcceptanceP0.js',
            'SCRIPTS\TestP2GCWholeSystemAcceptanceP0.js',
            'SCRIPTS\TestP2GCCustomerDeliveryAcceptanceP0.js',
            'SCRIPTS\TestP2GCGrowthAssetsAcceptanceP0.js',
            'SCRIPTS\TestMilesCoreHttpProbeP0.js',
            'SCRIPTS\TestDashboardPromotionClosureP0.js',
            'SCRIPTS\StartMilesApi.js',
            'StartProductionSystem.js',
            'SERVICES\digital_coo\MilesCommandCenter.js',
            'SERVICES\DashboardServerService.js',
            'SERVICES\DashboardDataService.js',
            'SERVICES\CEORevenueBriefService.js',
            'SERVICES\BusinessExecutionEngineServiceV2.js',
            'SERVICES\BusinessWorkPlannerService.js',
            'SERVICES\governance\PolicyEngineService.js',
            'SERVICES\governance\DemoProtectionService.js',
            'SERVICES\customer\P2GCCustomerDeliveryService.js',
            'SERVICES\growth\P2GCGrowthAssetService.js',
            'SERVICES\revenue\RevenueTruthGateService.js',
            'CONNECTORS\MILES\connector.js',
            'CONNECTORS\INSTANTLY\connector.js',
            'CONNECTORS\INSTANTLY\instantly.js',
            'CONNECTORS\ORION\connector.js',
            'TESTS\TestGovernanceNegationP0.js',
            'TESTS\TestExecutiveMissionExecutionP0.js',
            'TESTS\TestBusinessWorkPlannerExecutionContractP0.js',
            'TESTS\TestEphemeralConnectorBootstrapP0.js',
            'StartP2GCCustomerDelivery.js',
            'StartExecutiveDashboard.js',
            'StartMiles.js',
            'StartAutonomousCOO.js',
            'StartP2GCGrowthBlueprintDemo.js',
            'SCRIPTS\TestP2GCGrowthBlueprintDemoAcceptanceP0.js'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "Node syntax failed: $file" }
            Write-Host "[NODE CHECK OK] $file"
          }

      - name: Internal isolated acceptance gates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestDashboardPromotionClosureP0.js
          if ($LASTEXITCODE -ne 0) { throw 'CEO Dashboard promotion closure is incomplete.' }
          node .\SCRIPTS\TestReconcilePm2ProcessUnit.js
          if ($LASTEXITCODE -ne 0) { throw 'PM2 reconciliation unit tests failed.' }
          node .\TESTS\Build052GovernanceTest.js
          if ($LASTEXITCODE -ne 0) { throw 'Baseline constitutional governance tests failed.' }
          node .\TESTS\TestGovernanceNegationP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Negation-aware governance tests failed.' }
          node .\TESTS\TestBusinessWorkPlannerExecutionContractP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Business work planner connector/read-only contract failed.' }
          node .\TESTS\TestExecutiveMissionExecutionP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Executive mission execution test failed.' }
          node .\TESTS\TestEphemeralConnectorBootstrapP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Ephemeral child connector bootstrap test failed.' }
          node .\SCRIPTS\TestP2GCCustomerDeliveryAcceptanceP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Customer delivery acceptance failed.' }
          node .\SCRIPTS\TestP2GCGrowthAssetsAcceptanceP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Growth asset acceptance failed.' }
          node .\TESTS\TestWorkerExecutionBridgeBootstrap.js
          if ($LASTEXITCODE -ne 0) { throw 'Worker bootstrap acceptance failed.' }

      - name: Install and resolve PM2 for Windows integration
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm install -g pm2
          if ($LASTEXITCODE -ne 0) { throw 'PM2 install failed.' }
          $pm2Cli = (& node -e "process.stdout.write(require('./SCRIPTS/ReconcilePm2Process').resolvePm2Cli())").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $pm2Cli -or -not (Test-Path $pm2Cli -PathType Leaf)) { throw "Production PM2 resolver failed: $pm2Cli" }
          $env:MILES_PM2_CLI = $pm2Cli
          "MILES_PM2_CLI=$pm2Cli" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "[PM2 SETUP OK] production resolver found direct CLI=$pm2Cli"

      - name: Prove direct PM2 transport
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\Pm2DirectCommand.js jlist | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Direct PM2 command wrapper failed.' }
          Write-Host '[DIRECT PM2 TRANSPORT PASS]'

      - name: Reproduce and repair stale PM2 script identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestReconcilePm2ProcessIntegration.js
          if ($LASTEXITCODE -ne 0) { throw 'Real PM2 stale-identity repair integration failed.' }
