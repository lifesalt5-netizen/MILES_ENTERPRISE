name: MILES Recovery Static Validation

on:
  push:
    branches:
      - agent/miles-full-system-reconciliation-20260815
  workflow_dispatch:

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse PowerShell recovery scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'SCRIPTS\RunApprovedMilesEndToEndFinal.ps1',
            'SCRIPTS\RunApprovedMilesFullSystemReconciliation.ps1'
          )
          foreach ($file in $files) {
            [void][scriptblock]::Create((Get-Content $file -Raw))
            Write-Host "[POWERSHELL PARSE OK] $file"
          }

      - name: Node syntax gates
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'SCRIPTS\ReconcilePm2Process.js',
            'SCRIPTS\TestReconcilePm2ProcessUnit.js',
            'SCRIPTS\ReconcileMilesProductionSurfaces.js',
            'SCRIPTS\TestMilesFinalSurfaceAcceptanceP0.js',
            'SCRIPTS\RunMilesAcceptanceWithLiveMemory.js',
            'SCRIPTS\TestMilesProductionRecoveryAcceptanceP0.js',
            'SCRIPTS\StartMilesApi.js',
            'StartProductionSystem.js',
            'SERVICES\digital_coo\MilesCommandCenter.js',
            'StartExecutiveDashboard.js',
            'StartMiles.js',
            'StartAutonomousCOO.js',
            'StartP2GCGrowthBlueprintDemo.js',
            'SCRIPTS\TestP2GCGrowthBlueprintDemoAcceptanceP0.js'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "Node syntax failed: $file" }
            Write-Host "[NODE CHECK OK] $file"
          }

      - name: PM2 reconciliation regression tests
        shell: powershell
        run: |
          node .\SCRIPTS\TestReconcilePm2ProcessUnit.js
          if ($LASTEXITCODE -ne 0) { throw 'PM2 reconciliation unit tests failed.' }

      - name: Install PM2 for Windows integration
        shell: powershell
        run: |
          npm install -g pm2
          if ($LASTEXITCODE -ne 0) { throw 'PM2 install failed.' }
          pm2 kill 2>$null

      - name: Reproduce and repair stale PM2 script identity
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $PWD 'SCRIPTS\pm2-reconcile-fixture.js'
          @'
          "use strict";
          setInterval(() => {}, 1000);
          '@ | Set-Content $fixture -Encoding UTF8

          pm2 start $fixture --name legacy-api
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create stale PM2 fixture.' }

          $before = pm2 jlist | ConvertFrom-Json
          $legacy = $before | Where-Object { $_.name -eq 'legacy-api' }
          if (-not $legacy) { throw 'Stale PM2 fixture was not registered.' }

          node .\SCRIPTS\ReconcilePm2Process.js miles-api $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Canonical PM2 reconciliation failed.' }

          $after = pm2 jlist | ConvertFrom-Json
          $canonical = @($after | Where-Object { $_.name -eq 'miles-api' })
          $stale = @($after | Where-Object { $_.name -eq 'legacy-api' })
          $sameScript = @($after | Where-Object {
            [IO.Path]::GetFullPath($_.pm2_env.pm_exec_path).ToLowerInvariant() -eq [IO.Path]::GetFullPath($fixture).ToLowerInvariant()
          })

          if ($canonical.Count -ne 1) { throw "Expected one canonical miles-api; found $($canonical.Count)." }
          if ($canonical[0].pm2_env.status -ne 'online') { throw "Canonical miles-api is not online: $($canonical[0].pm2_env.status)" }
          if ($stale.Count -ne 0) { throw 'legacy-api registration still exists.' }
          if ($sameScript.Count -ne 1) { throw "Expected one registration for fixture script; found $($sameScript.Count)." }

          Write-Host '[PM2 INTEGRATION PASS] stale script identity repaired without -f and without duplicates'
          pm2 delete miles-api
          Remove-Item $fixture -Force
