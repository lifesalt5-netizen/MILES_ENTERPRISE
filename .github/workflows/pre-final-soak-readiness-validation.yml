name: Pre Final Soak Readiness Validation

on:
  pull_request:
    paths:
      - "PRE_FINAL_SOAK_RELEASE_CANDIDATE.cmd"
      - "FINAL_GO_LIVE.cmd"
      - "SCRIPTS/RunPreFinalSoakReadiness.ps1"
      - "SCRIPTS/AuditProposalCommandReadiness.js"
      - "SCRIPTS/AuditIonosExecutiveInboxReadOnly.js"
      - "SCRIPTS/AUDIT_OUTBOUND_SENDER_CAPACITY_V2.js"
      - "SCRIPTS/AuditInstantlyCampaignScheduleGovernance.js"
      - "SCRIPTS/AuditInstantlySendWindowHistory.js"
      - "SCRIPTS/RepairInstantlyWeekdaySchedules.js"
      - "SERVICES/sales/P2GCSalesQualificationService.js"
      - "SERVICES/proposal/**"
      - "SERVICES/monica/**"
      - "CONFIG/MONICA/**"
      - "SERVICES/demo/public/proposal-command*"
      - "SERVICES/ceo_dashboard/public/index.html"
      - "StartP2GCGrowthBlueprintDemo.js"
      - "RUN_P2GC_PROPOSAL_COMMAND.js"
      - "TESTS/**"
      - ".github/workflows/pre-final-soak-readiness-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("SCRIPTS/RunPreFinalSoakReadiness.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Node syntax
        run: |
          node --check SCRIPTS/AuditProposalCommandReadiness.js
          node --check SCRIPTS/AuditIonosExecutiveInboxReadOnly.js
          node --check SCRIPTS/AUDIT_OUTBOUND_SENDER_CAPACITY_V2.js
          node --check SCRIPTS/AuditInstantlyCampaignScheduleGovernance.js
          node --check SCRIPTS/AuditInstantlySendWindowHistory.js
          node --check SCRIPTS/RepairInstantlyWeekdaySchedules.js
          node --check SERVICES/sales/P2GCSalesQualificationService.js
          node --check SERVICES/proposal/P2GCProposalCommandService.js
          node --check SERVICES/proposal/P2GCPostSubmissionLearningService.js
          node --check SERVICES/monica/MonicaDiscoveryCandidateService.js
          node --check RUN_P2GC_PROPOSAL_COMMAND.js
          node --check StartP2GCGrowthBlueprintDemo.js
          node --check SERVICES/demo/public/proposal-command.js
      - name: Weekday governance regression
        run: node TESTS/Test_InstantlyCampaignScheduleGovernance.js
      - name: Send-window timestamp regression
        run: node TESTS/Test_InstantlySendWindowHistory.js
      - name: Proposal Stage 0 decision labels
        run: node TESTS/Test_P2GCSalesQualificationDecisionLabels.js
      - name: Proposal Command controlled E2E
        run: |
          node TESTS/Test_P2GCProposalCommandService.js
          node TESTS/Test_P2GCPostSubmissionLearningService.js
      - name: MONICA research-only safety suite
        run: |
          node TESTS/Test_MonicaDiscoveryAssessment.js
          node TESTS/Test_MonicaDiscoveryCandidateService.js
          node TESTS/Test_MonicaSourceAccessManifest.js
      - name: Acquisition V2 unit suite
        run: |
          node TESTS/Test_FederalPathwayScoreService.js
          node TESTS/Test_FederalPathwayScoreIntegratedService.js
          node TESTS/Test_RevenueWeightedCampaignScorecardService.js
          node TESTS/Test_QualifiedProspectNurtureService.js
          node TESTS/Test_P2GCAcquisitionV2CampaignService.js
          node TESTS/Test_P2GCAcquisitionV2ProspectEnrichmentService.js
          node TESTS/Test_P2GCB12ConversionManifest.js
          node TESTS/Test_P2GCWebsiteConversionAuditService.js
      - name: Core/dashboard safety suite
        run: |
          node TESTS/E0030RevenueTruthGate.test.js
          node TESTS/meeting_pipeline_readonly_safety_test.js
          node TESTS/production_go_live_acceptance_audit_safety_test.js
          node TESTS/TestExecutiveDashboardData.js
          node TESTS/TestExecutiveMissionRouter.js
          node TESTS/TestExecutiveToEngineering.js
          node TESTS/TestExecutiveToEngineeringFlow.js
      - name: Proposal Command canonical readiness
        run: node SCRIPTS/AuditProposalCommandReadiness.js --root=$GITHUB_WORKSPACE

  windows-powershell51-serialization:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 result serialization regression
        shell: powershell
        run: .\TESTS\Test_PreFinalSoakResultSerialization.ps1
      - name: Windows PowerShell 5.1 execution-contract regression
        shell: powershell
        run: .\TESTS\Test_PreFinalSoakExecutionContract.ps1
