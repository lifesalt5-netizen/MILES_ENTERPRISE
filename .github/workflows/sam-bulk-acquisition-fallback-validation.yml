name: SAM Bulk Acquisition Fallback Validation
on:
  push:
    branches:
      - 'fix/sam-bulk-extract-refresh-20260830'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check SERVICES/orion/SamBulkExtractAcquisitionService.js
      - run: node TESTS/sam_bulk_acquisition_fallback.test.js
      - run: node TESTS/sam_bulk_refresh_strategy.test.js
