name: P2GC Acquisition V2 Validation

on:
  push:
    branches: ["main"]
    paths:
      - "CONFIG/p2gc_*"
      - "DATA/marketing_coo/competitor_intelligence/**"
      - "DATA/marketing_coo/buyer_lens_news/**"
      - "SERVICES/FederalPathwayScore*.js"
      - "SERVICES/revenue/P2GC*.js"
      - "SERVICES/revenue/RevenueWeightedCampaignScorecardService.js"
      - "SERVICES/revenue/QualifiedProspectNurtureService.js"
      - "CONNECTORS/WEBSITE_B12/**"
      - "CONNECTORS/LINKEDIN/**"
      - "RUN_P2GC_*"
      - "RUN_FEDERAL_PATHWAY_SCORE_INTEGRATED.js"
      - "StartP2GCGrowthBlueprintDemo.js"
      - "TESTS/Test_P2GC*.js"
      - "TESTS/Test_FederalPathwayScore*.js"
      - "TESTS/Test_RevenueWeightedCampaignScorecardService.js"
      - "TESTS/Test_QualifiedProspectNurtureService.js"
      - ".github/workflows/p2gc-acquisition-v2-validation.yml"
  pull_request:
    paths:
      - "CONFIG/p2gc_*"
      - "DATA/marketing_coo/competitor_intelligence/**"
      - "DATA/marketing_coo/buyer_lens_news/**"
      - "SERVICES/FederalPathwayScore*.js"
      - "SERVICES/revenue/P2GC*.js"
      - "SERVICES/revenue/RevenueWeightedCampaignScorecardService.js"
      - "SERVICES/revenue/QualifiedProspectNurtureService.js"
      - "CONNECTORS/WEBSITE_B12/**"
      - "CONNECTORS/LINKEDIN/**"
      - "RUN_P2GC_*"
      - "RUN_FEDERAL_PATHWAY_SCORE_INTEGRATED.js"
      - "StartP2GCGrowthBlueprintDemo.js"
      - "TESTS/Test_P2GC*.js"
      - "TESTS/Test_FederalPathwayScore*.js"
      - "TESTS/Test_RevenueWeightedCampaignScorecardService.js"
      - "TESTS/Test_QualifiedProspectNurtureService.js"
      - ".github/workflows/p2gc-acquisition-v2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax validation
        run: |
          node --check SERVICES/FederalPathwayScoreService.js
          node --check SERVICES/FederalPathwayScoreIntegratedService.js
          node --check SERVICES/revenue/RevenueWeightedCampaignScorecardService.js
          node --check SERVICES/revenue/QualifiedProspectNurtureService.js
          node --check SERVICES/revenue/P2GCAcquisitionV2CampaignService.js
          node --check SERVICES/revenue/P2GCAcquisitionV2ProspectEnrichmentService.js
          node --check SERVICES/revenue/P2GCWebsiteConversionAuditService.js
          node --check SERVICES/revenue/P2GCAuthorityContentProductionService.js
          node --check SERVICES/revenue/P2GCCompetitorExperimentService.js
          node --check SERVICES/revenue/P2GCBuyerLensContentService.js
          node --check SERVICES/revenue/P2GCLinkedInPublishingService.js
          node --check SERVICES/revenue/P2GCAcquisitionV2AcceptanceService.js
          node --check CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER.js
          node --check CONNECTORS/LINKEDIN/LinkedInControlledPublisher.js
          node --check RUN_FEDERAL_PATHWAY_SCORE_INTEGRATED.js
          node --check RUN_P2GC_REVENUE_SCORECARD.js
          node --check RUN_P2GC_QUALIFIED_NURTURE.js
          node --check RUN_P2GC_ACQUISITION_V2_DEPLOYMENT.js
          node --check RUN_P2GC_ACQUISITION_V2_PILOT.js
          node --check RUN_P2GC_AUTHORITY_CONTENT.js
          node --check RUN_P2GC_COMPETITOR_EXPERIMENTS.js
          node --check RUN_P2GC_BUYER_LENS_CONTENT.js
          node --check RUN_P2GC_LINKEDIN_PUBLISH.js
          node --check RUN_P2GC_ACQUISITION_V2_ACCEPTANCE.js
          node --check StartP2GCGrowthBlueprintDemo.js

      - name: PowerShell runner parse validation
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './RUN_P2GC_ACQUISITION_V2_E2E.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Federal Pathway Score MVP test
        run: node TESTS/Test_FederalPathwayScoreService.js

      - name: Integrated Federal Pathway Score test
        run: node TESTS/Test_FederalPathwayScoreIntegratedService.js

      - name: Revenue-weighted campaign scorecard test
        run: node TESTS/Test_RevenueWeightedCampaignScorecardService.js

      - name: Qualified prospect nurture test
        run: node TESTS/Test_QualifiedProspectNurtureService.js

      - name: P2GC V2 campaign deployment test
        run: node TESTS/Test_P2GCAcquisitionV2CampaignService.js

      - name: P2GC V2 prospect enrichment test
        run: node TESTS/Test_P2GCAcquisitionV2ProspectEnrichmentService.js

      - name: B12 conversion manifest test
        run: node TESTS/Test_P2GCB12ConversionManifest.js

      - name: Public website conversion audit test
        run: node TESTS/Test_P2GCWebsiteConversionAuditService.js

      - name: Authority content production test
        run: node TESTS/Test_P2GCAuthorityContentProductionService.js

      - name: Competitor experiment engine test
        run: node TESTS/Test_P2GCCompetitorExperimentService.js

      - name: Buyer Lens content test
        run: node TESTS/Test_P2GCBuyerLensContentService.js

      - name: LinkedIn publication routing test
        run: node TESTS/Test_P2GCLinkedInPublishingService.js

      - name: Final acceptance truth service test
        run: node TESTS/Test_P2GCAcquisitionV2AcceptanceService.js

# 2026-09-04 full-systems closeout validation refresh.
