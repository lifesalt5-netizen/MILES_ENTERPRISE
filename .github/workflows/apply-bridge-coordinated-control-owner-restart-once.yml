name: Apply Bridge Coordinated Control Owner Restart Once

on:
  push:
    branches:
      - 'fix/bridge-coordinated-control-owner-restart-20260829'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bridge-coordinated-control-owner-restart-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check guarded repair
        run: node --check SCRIPTS/RepairBridgeCoordinatedControlOwnerRestart.js
      - name: Dry run guarded repair
        run: node SCRIPTS/RepairBridgeCoordinatedControlOwnerRestart.js
      - name: Apply guarded repair
        run: node SCRIPTS/RepairBridgeCoordinatedControlOwnerRestart.js --apply
      - name: Validate repaired sources without runtime dependencies
        run: |
          node --check StartMilesRemoteExecutionBridge.js
          node --check SERVICES/runtime/RemoteExecutionBridgeSupervisor.js
          node --check SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          node TESTS/bridge_coordinated_control_owner_restart_regression.test.js
          node TESTS/remote_execution_bridge_supervisor.test.js
          grep -Fq "COO_CONSOLIDATED_SELF_MAINTENANCE_DEPLOY" StartMilesRemoteExecutionBridge.js
          grep -Fq "CONTROL_OWNER_RESTART_EXIT_CODE = 76" StartMilesRemoteExecutionBridge.js
          grep -Fq "CONTROL_OWNER_RESTART_REQUESTED" SERVICES/runtime/RemoteExecutionBridgeSupervisor.js
      - name: Commit repaired production sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js SERVICES/runtime/RemoteExecutionBridgeSupervisor.js SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Coordinate control owner restart after remote evidence'
            git push origin HEAD:fix/bridge-coordinated-control-owner-restart-20260829
          fi
