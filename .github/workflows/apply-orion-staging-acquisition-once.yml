name: Apply ORION Staging Acquisition Once

on:
  push:
    branches:
      - 'feat/orion-acquire-official-staging-20260830'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-acquire-official-staging-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and contract validation
        run: |
          node --check SERVICES/orion/OrionOfficialSourceStagingAcquisitionService.js
          node --check SCRIPTS/AcquireOrionOfficialSourceToStaging.js
          node --check SCRIPTS/RepairOrionStagingAcquisitionAllowlist.js
          node TESTS/orion_official_source_staging_acquisition.test.js
      - name: Dry run guarded allowlist repair
        run: node SCRIPTS/RepairOrionStagingAcquisitionAllowlist.js
      - name: Apply guarded allowlist repair
        run: node SCRIPTS/RepairOrionStagingAcquisitionAllowlist.js --apply
      - name: Validate patched bridge source
        run: |
          node --check StartMilesRemoteExecutionBridge.js
          grep -Fq "ORION_OFFICIAL_SOURCE_ACQUIRE_STAGING: ['node', ['SCRIPTS/AcquireOrionOfficialSourceToStaging.js']]" StartMilesRemoteExecutionBridge.js
          echo ORION_STAGING_ACQUISITION_SOURCE_PASS
      - name: Commit bridge allowlist
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Allowlist ORION official staging acquisition'
            git push origin HEAD:feat/orion-acquire-official-staging-20260830
          fi
