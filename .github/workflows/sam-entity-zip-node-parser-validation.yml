name: SAM Entity ZIP Node Parser Validation
on:
  push:
    branches:
      - 'fix/sam-entity-zip-node-parser-20260830'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check SCRIPTS/InspectSamBulkSchema.js
      - run: |
          grep -q "ZIP_EOCD_NOT_FOUND" SCRIPTS/InspectSamBulkSchema.js
          grep -q "nativeZipParser:true" SCRIPTS/InspectSamBulkSchema.js
          if grep -q "powershell.exe" SCRIPTS/InspectSamBulkSchema.js; then exit 1; fi
