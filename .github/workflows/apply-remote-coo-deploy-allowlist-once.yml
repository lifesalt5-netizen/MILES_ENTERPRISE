name: Apply Remote COO Deploy Allowlist Once

on:
  push:
    branches:
      - 'fix/remote-deploy-consolidated-coo-20260829'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remote-deploy-consolidated-coo-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check guarded repair
        run: node --check SCRIPTS/RepairRemoteCOODeployAllowlist.js
      - name: Dry run guarded repair
        run: node SCRIPTS/RepairRemoteCOODeployAllowlist.js
      - name: Apply guarded repair
        run: node SCRIPTS/RepairRemoteCOODeployAllowlist.js --apply
      - name: Validate bridge source without runtime dependencies
        shell: bash
        run: |
          node --check StartMilesRemoteExecutionBridge.js
          node --check TESTS/remote_execution_bridge_safety.test.js
          grep -Fq "COO_CONSOLIDATED_SELF_MAINTENANCE_DEPLOY: ['node', ['SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js']]" StartMilesRemoteExecutionBridge.js
          grep -Fq "'COO_CONSOLIDATED_SELF_MAINTENANCE_DEPLOY'" TESTS/remote_execution_bridge_safety.test.js
          grep -Fq "validateDirective({id:'x',enabled:true,job:'COO_CONSOLIDATED_SELF_MAINTENANCE_DEPLOY'}).ok, true" TESTS/remote_execution_bridge_safety.test.js
          grep -Fq "JOB_NOT_ALLOWLISTED" StartMilesRemoteExecutionBridge.js
          echo REMOTE_COO_DEPLOY_ALLOWLIST_SOURCE_PASS
      - name: Commit bridge allowlist
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js TESTS/remote_execution_bridge_safety.test.js
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Allowlist consolidated COO self-maintenance deploy'
            git push origin HEAD:fix/remote-deploy-consolidated-coo-20260829
          fi
