name: Apply Autonomous Credential Orphan Routing Once

on:
  push:
    branches:
      - 'fix/autonomous-credential-orphan-routing-20260829'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/autonomous-credential-orphan-routing-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check repair
        run: node --check SCRIPTS/RepairAutonomousCredentialOrphanRouting.js
      - name: Dry run guarded repair
        run: node SCRIPTS/RepairAutonomousCredentialOrphanRouting.js
      - name: Apply guarded repair
        run: node SCRIPTS/RepairAutonomousCredentialOrphanRouting.js --apply
      - name: Validate repaired source
        run: |
          node --check SERVICES/AutonomousWorkGenerationService.js
          node --check SERVICES/SelfMaintenanceService.js
          node TESTS/autonomous_credential_orphan_routing_regression.test.js
          node TESTS/self_maintenance_autonomy_regression.test.js
      - name: Commit repaired production source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SERVICES/AutonomousWorkGenerationService.js SERVICES/SelfMaintenanceService.js
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Prevent autonomous credential approval orphans'
            git push origin HEAD:fix/autonomous-credential-orphan-routing-20260829
          fi
