name: Revenue Universe Routing Validation

on:
  pull_request:
    paths:
      - 'SERVICES/BusinessWorkPlannerService.js'
      - 'SERVICES/revenue/RevenueUniverseReconciliationService.js'
      - 'SERVICES/revenue/AwardedUniverseCoverageService.js'
      - 'SERVICES/revenue/Fy2026AwardedUniverseCoverageService.js'
      - 'SERVICES/revenue/CanonicalAwardedContractorMasterService.js'
      - 'SERVICES/revenue/CanonicalContractorTaxonomyOverlayService.js'
      - 'SERVICES/revenue/MasterContractorTaxonomyEngine.js'
      - 'SERVICES/revenue/AwardHistoryLocalInventoryService.js'
      - 'SERVICES/revenue/SixFiscalYearAwardSourceValidationService.js'
      - 'SERVICES/revenue/SixFiscalYearAwardUniverseNormalizerService.js'
      - 'DATA/registry/OutboundRevenueSegmentModel.json'
      - 'DATA/registry/AwardedContractorSegmentOverlayModel.json'
      - 'DATA/registry/P2GCMasterContractorSegmentationTaxonomy.json'
      - 'DATA/registry/AwardHistoryLookbackPolicy.json'
      - 'CORE/ExecutionActionContracts.js'
      - 'CONNECTORS/MILES/connector.js'
      - 'StartMilesRemoteExecutionBridge.js'
      - 'SCRIPTS/RunRevenueUniverseReconciliation.js'
      - 'SCRIPTS/RunFy2026AwardedUniverseCoverage.js'
      - 'SCRIPTS/RunSixFiscalYearAwardUniverseNormalization.js'
      - 'TESTS/Test_RevenueUniverseMissionRouting.js'
      - 'TESTS/Test_RevenueUniverseDuplicateIdentityAccounting.js'
      - 'TESTS/Test_AwardedUniverseCoverageIdentity.js'
      - 'TESTS/Test_Fy2026AwardedUniverseCoverageService.js'
      - 'TESTS/Test_CanonicalAwardedContractorMasterSegmentation.js'
      - 'TESTS/Test_MasterContractorTaxonomyEngine.js'
      - 'TESTS/Test_AwardHistoryLocalInventoryService.js'
      - 'TESTS/Test_SixFiscalYearAwardSourceValidationService.js'
      - 'TESTS/Test_SixFiscalYearAwardUniverseNormalizerService.js'
      - 'TESTS/remote_execution_bridge_safety.test.js'
      - '.github/workflows/revenue-universe-routing-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax and registry check
        run: |
          node --check SERVICES/BusinessWorkPlannerService.js
          node --check SERVICES/revenue/RevenueUniverseReconciliationService.js
          node --check SERVICES/revenue/AwardedUniverseCoverageService.js
          node --check SERVICES/revenue/Fy2026AwardedUniverseCoverageService.js
          node --check SERVICES/revenue/CanonicalAwardedContractorMasterService.js
          node --check SERVICES/revenue/CanonicalContractorTaxonomyOverlayService.js
          node --check SERVICES/revenue/MasterContractorTaxonomyEngine.js
          node --check SERVICES/revenue/AwardHistoryLocalInventoryService.js
          node --check SERVICES/revenue/SixFiscalYearAwardSourceValidationService.js
          node --check SERVICES/revenue/SixFiscalYearAwardUniverseNormalizerService.js
          node --check CORE/ExecutionActionContracts.js
          node --check CONNECTORS/MILES/connector.js
          node --check StartMilesRemoteExecutionBridge.js
          node --check SCRIPTS/RunRevenueUniverseReconciliation.js
          node --check SCRIPTS/RunFy2026AwardedUniverseCoverage.js
          node --check SCRIPTS/RunSixFiscalYearAwardUniverseNormalization.js
          node --check TESTS/Test_RevenueUniverseMissionRouting.js
          node --check TESTS/Test_RevenueUniverseDuplicateIdentityAccounting.js
          node --check TESTS/Test_AwardedUniverseCoverageIdentity.js
          node --check TESTS/Test_Fy2026AwardedUniverseCoverageService.js
          node --check TESTS/Test_CanonicalAwardedContractorMasterSegmentation.js
          node --check TESTS/Test_MasterContractorTaxonomyEngine.js
          node --check TESTS/Test_AwardHistoryLocalInventoryService.js
          node --check TESTS/Test_SixFiscalYearAwardSourceValidationService.js
          node --check TESTS/Test_SixFiscalYearAwardUniverseNormalizerService.js
          node --check TESTS/remote_execution_bridge_safety.test.js
          node - <<'NODE'
          const fs = require('fs');
          for (const file of [
            'DATA/registry/AwardedContractorSegmentOverlayModel.json',
            'DATA/registry/P2GCMasterContractorSegmentationTaxonomy.json',
            'DATA/registry/AwardHistoryLookbackPolicy.json'
          ]) JSON.parse(fs.readFileSync(file,'utf8'));
          NODE
      - name: Revenue universe routing regression
        run: node TESTS/Test_RevenueUniverseMissionRouting.js
      - name: Duplicate identity accounting regression
        run: node TESTS/Test_RevenueUniverseDuplicateIdentityAccounting.js
      - name: Awarded universe identity regression
        run: node TESTS/Test_AwardedUniverseCoverageIdentity.js
      - name: FY2026 awarded universe regression
        run: node TESTS/Test_Fy2026AwardedUniverseCoverageService.js
      - name: Canonical awarded master segmentation regression
        run: node TESTS/Test_CanonicalAwardedContractorMasterSegmentation.js
      - name: Master contractor taxonomy regression
        run: node TESTS/Test_MasterContractorTaxonomyEngine.js
      - name: Local award-history inventory regression
        run: node TESTS/Test_AwardHistoryLocalInventoryService.js
      - name: Six-FY local award source validation regression
        run: node TESTS/Test_SixFiscalYearAwardSourceValidationService.js
      - name: Six-FY awarded universe normalization regression
        run: node TESTS/Test_SixFiscalYearAwardUniverseNormalizerService.js
      - name: Remote bridge allowlist regression
        run: node TESTS/remote_execution_bridge_safety.test.js
      - name: Static safety and architecture assertions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('SERVICES/revenue/RevenueUniverseReconciliationService.js','utf8');
          const awarded = fs.readFileSync('SERVICES/revenue/AwardedUniverseCoverageService.js','utf8');
          const fyAwarded = fs.readFileSync('SERVICES/revenue/Fy2026AwardedUniverseCoverageService.js','utf8');
          const canonical = fs.readFileSync('SERVICES/revenue/CanonicalAwardedContractorMasterService.js','utf8');
          const taxonomyOverlay = fs.readFileSync('SERVICES/revenue/CanonicalContractorTaxonomyOverlayService.js','utf8');
          const taxonomyEngine = fs.readFileSync('SERVICES/revenue/MasterContractorTaxonomyEngine.js','utf8');
          const localHistory = fs.readFileSync('SERVICES/revenue/AwardHistoryLocalInventoryService.js','utf8');
          const sixFySources = fs.readFileSync('SERVICES/revenue/SixFiscalYearAwardSourceValidationService.js','utf8');
          const sixFyNormalizer = fs.readFileSync('SERVICES/revenue/SixFiscalYearAwardUniverseNormalizerService.js','utf8');
          const runner = fs.readFileSync('SCRIPTS/RunRevenueUniverseReconciliation.js','utf8');
          const fyRunner = fs.readFileSync('SCRIPTS/RunFy2026AwardedUniverseCoverage.js','utf8');
          const sixFyRunner = fs.readFileSync('SCRIPTS/RunSixFiscalYearAwardUniverseNormalization.js','utf8');
          const bridge = fs.readFileSync('StartMilesRemoteExecutionBridge.js','utf8');
          const taxonomyRegistry = JSON.parse(fs.readFileSync('DATA/registry/P2GCMasterContractorSegmentationTaxonomy.json','utf8'));
          const lookback = JSON.parse(fs.readFileSync('DATA/registry/AwardHistoryLookbackPolicy.json','utf8'));

          for (const token of [
            'productionOrionModified: false', 'providerMutation: false', 'campaignMutation: false',
            'emailSent: false', 'suppressionOverridden: false', 'outputStagingOnly: true',
            'DUPLICATE_MERGED_ENTITY', 'canonicalContractorIdentities: seenIdentityKeys.size'
          ]) if (!source.includes(token)) throw new Error('Missing safety/accounting assertion: ' + token);

          for (const token of [
            'exactUniquePrimeAwardedUeis','exactUniqueSubcontractAwardedUeis','exactUniqueAwardedUeisEitherRole',
            'exactAwardedUeisInCurrentMaster','exactAwardedUeisMissingFromCurrentMaster','EXACT_COUNTS_USE_UEI_ONLY'
          ]) if (!awarded.includes(token)) throw new Error('Missing exact awarded-universe assertion: ' + token);

          for (const token of [
            'ORION_VALIDATED_USASPENDING_FY2026_SIDECAR', "spending_level: ['subawards']", 'SUBAWARD_SOURCE_REACHED_500K_CAP',
            'sourceDatesAligned: true','exactUniqueAwardedUeisEitherRole','currentMasterCoveragePercentOfAwardedUniverse',
            'productionOrionModified: false','emailSent: false'
          ]) if (!fyAwarded.includes(token)) throw new Error('Missing FY2026 exactness/safety assertion: ' + token);

          for (const token of [
            'canonicalRowsEqualAwardedUnion','zeroAwardedUeisMissingFromCanonicalMaster','CURRENT_SEGMENT_RETAINED',
            'AWARDED_ROLE_FALLBACK_CREATED','CONTACT_ENRICHMENT_REQUIRED','OUTBOUND_READY',
            'currentOutboundMasterModified: false','outboundReadyExportsRequireVerifiedUnsuppressedContact: true'
          ]) if (!canonical.includes(token)) throw new Error('Missing canonical master assertion: ' + token);

          for (const token of [
            'taxonomyRowsEqualCanonicalRows','zeroCanonicalAccountsMissingTaxonomy','all_segment_tags_json',
            'commercial_disposition','next_action','currentOutboundMasterModified: false','emailSent: false'
          ]) if (!taxonomyOverlay.includes(token)) throw new Error('Missing taxonomy overlay assertion: ' + token);

          for (const token of [
            'lt_100k','100k_500k','500k_1m','1m_3m','3m_5m','5m_10m','10m_25m','25m_50m','50m_100m','100m_plus',
            'AWARD_CURRENT_FY','AWARD_PRIOR_5Y','NO_PROVEN_AWARD_ROLE','UNKNOWN'
          ]) if (!taxonomyEngine.includes(token)) throw new Error('Missing taxonomy engine classification: ' + token);

          for (const token of ['D:\\\\P2GC_Intelligence','C:\\\\P2GC_Intelligence','readOnlyFilesystemScan: true','filesModified: false']) {
            if (!localHistory.includes(token)) throw new Error('Missing local history inventory safeguard: ' + token);
          }

          for (const token of [
            'SIX_FY_LOCAL_SOURCE_VALIDATION_GREEN','SIX_FY_LOCAL_SOURCE_GAPS_PRESENT',
            'localInventoryFirst: true','schemaValidationRequired: true','backupsPenalized: true',
            'duplicateDatedFullSnapshotsCollapsedToNewest: true','missingUeiRowsMustNotBeDiscardedByNormalizer: true',
            "secondaryIdentityResolutionRequired: ['CAGE', 'NORMALIZED_NAME_PLUS_DOMAIN', 'NORMALIZED_NAME_PLUS_ADDRESS']",
            'unknownIdentityMustRemainVisible: true','acquisitionTriggered: false'
          ]) if (!sixFySources.includes(token)) throw new Error('Missing six-FY source-validation contract: ' + token);

          for (const token of [
            'SIX_FY_SOURCE_GAPS_BLOCK_NORMALIZATION','SIX_FY_AWARDED_UNIVERSE_NORMALIZED',
            'UNKNOWN_IDENTITY_KEY','SECONDARY_MATCH_TO_UEI','historicalAwardedUniverseCoveragePercent',
            'uniqueFy21Fy26PrimeWinners','uniqueFy21Fy26SubcontractWinners','uniqueAppearingInBoth','dedupedAwardedUniverse',
            'firstAwardFy','lastAwardFy','primeYears','subYears','trajectory(account)',
            'currentMasterModified: false','productionOrionModified: false','campaignMutation: false','emailSent: false'
          ]) if (!sixFyNormalizer.includes(token)) throw new Error('Missing six-FY normalization contract: ' + token);

          for (const token of ['readyForSixFiscalYearNormalization','missingRequirements','MILES_SIX_FY_AWARDED_UNIVERSE_NORMALIZATION_FINAL']) {
            if (!sixFyRunner.includes(token)) throw new Error('Six-FY runner missing governing output: ' + token);
          }

          if (taxonomyRegistry.architecture !== 'MULTI_DIMENSIONAL_NON_MUTUALLY_EXCLUSIVE') throw new Error('Master taxonomy must remain multi-dimensional.');
          if (taxonomyRegistry.governingRules?.onePrimaryOutboundCampaignPerCompany !== true) throw new Error('One primary outbound campaign rule missing.');
          if (taxonomyRegistry.governingRules?.unknownMustRemainDistinctFromZero !== true) throw new Error('UNKNOWN/zero distinction missing.');
          if (!Array.isArray(taxonomyRegistry.dimensions) || taxonomyRegistry.dimensions.length < 30) throw new Error('Master taxonomy dimensions incomplete.');
          if (lookback.sourceReusePolicy?.inventoryExistingLocalHistoryFirst !== true) throw new Error('Local history inventory-first rule missing.');
          if (lookback.sourceReusePolicy?.acquireOnlyYearsMissingOrUnusableAfterInventory !== true) throw new Error('Missing-only acquisition rule missing.');
          if (JSON.stringify(lookback.fiscalYearScope?.includedFiscalYears) !== JSON.stringify([2021,2022,2023,2024,2025,2026])) throw new Error('Six-FY lookback scope incorrect.');

          for (const text of [source, awarded, fyAwarded, canonical, taxonomyOverlay, taxonomyEngine, localHistory, sixFySources, sixFyNormalizer, runner, fyRunner, sixFyRunner]) {
            if (text.includes('uploadLeads(') || text.includes('activateCampaign(') || text.includes('sendEmail(')) {
              throw new Error('Revenue universe reconciliation must not contain live-send/activation calls.');
            }
          }
          for (const token of ['CanonicalAwardedContractorMasterService','CanonicalContractorTaxonomyOverlayService','AwardHistoryLocalInventoryService','SixFiscalYearAwardSourceValidationService','Fy2026AwardedUniverseCoverageService']) {
            if (!runner.includes(token)) throw new Error('Runtime runner missing component: ' + token);
          }
          if (!bridge.includes("REVENUE_UNIVERSE_RECONCILIATION: ['node', ['SCRIPTS/RunRevenueUniverseReconciliation.js']]")) throw new Error('Governed revenue universe runtime job is not fixed-allowlisted.');
          if (!bridge.includes("FY2026_AWARDED_UNIVERSE_COVERAGE: ['node', ['SCRIPTS/RunFy2026AwardedUniverseCoverage.js']]")) throw new Error('Governed FY2026 awarded-universe runtime job is not fixed-allowlisted.');
          console.log('REVENUE_UNIVERSE_STATIC_SAFETY: GREEN');
          NODE
