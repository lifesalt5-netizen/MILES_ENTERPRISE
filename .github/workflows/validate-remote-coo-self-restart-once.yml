name: Validate Remote COO Self Restart Once

on:
  push:
    branches:
      - 'fix/remote-coo-deploy-self-restart-20260829'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remote-coo-deploy-self-restart-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
      - name: Verify remote self-preservation contract
        shell: bash
        run: |
          grep -Fq "REMOTE_BRIDGE_SUPERVISED" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -Fq "DELAYED_AFTER_REMOTE_EVIDENCE" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -Fq "scheduleDelayedRestart(byName.get('miles-autonomous-coo'))" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -Fq "restartKnownApp(byName.get('miles-worker'))" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -Fq "restartKnownApp(byName.get('miles-command-center'))" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -Fq "COO_CONSOLIDATED_DEPLOY_GREEN" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -Fq "APPROVALS_GRANTED_BY_MAINTENANCE=0" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -Fq "TASKS_RESUMED_BY_MAINTENANCE=0" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -Fq "TASKS_DELETED_BY_MAINTENANCE=0" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          echo REMOTE_COO_SELF_RESTART_CONTRACT_PASS
      - name: Run self-maintenance autonomy regression
        run: node TESTS/self_maintenance_autonomy_regression.test.js
