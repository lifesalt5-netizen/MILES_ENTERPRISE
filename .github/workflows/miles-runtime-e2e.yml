name: MILES Windows Runtime E2E

on:
  push:
    branches:
      - agent/miles-full-system-reconciliation-20260815
  workflow_dispatch:

jobs:
  core-runtime-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MILES_ROOT: ${{ github.workspace }}
      MILES_API_PORT: '3000'
      MILES_COMMAND_PORT: '8787'
      MILES_COMMAND_CENTER_PORT: '8787'
      MILES_DASHBOARD_PORT: '8737'
      MILES_PORT: '3737'
      P2GC_CUSTOMER_PORT: '8792'
      MILES_AUTONOMOUS_INTERVAL_MS: '600000'
      MILES_AUTONOMOUS_WORK_INTERVAL_MS: '600000'
      MILES_INFRASTRUCTURE_HEALTH_INTERVAL_MS: '600000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm install -g pm2
          if ($LASTEXITCODE -ne 0) { throw 'PM2 install failed.' }

      - name: Prepare clean PM2 state
        shell: powershell
        run: |
          $previous = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try { pm2 kill 2>&1 | Out-Host } finally { $ErrorActionPreference = $previous }
          Write-Host '[PM2] clean state ready'

      - name: Run isolated P2GC service acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestP2GCCustomerDeliveryAcceptanceP0.js
          if ($LASTEXITCODE -ne 0) { throw 'P2GC customer delivery acceptance failed.' }
          node .\SCRIPTS\TestP2GCGrowthAssetsAcceptanceP0.js
          if ($LASTEXITCODE -ne 0) { throw 'P2GC growth asset acceptance failed.' }
          node .\TESTS\TestWorkerExecutionBridgeBootstrap.js
          if ($LASTEXITCODE -ne 0) { throw 'Worker bootstrap/self-development acceptance failed.' }

      - name: Start canonical MILES core surfaces
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\ReconcileMilesProductionSurfaces.js miles-api miles-worker miles-command-center miles-executive-dashboard miles-desktop-ui miles-autonomous-coo p2gc-customer-delivery
          if ($LASTEXITCODE -ne 0) { throw 'Unable to start canonical MILES core surfaces.' }
          Start-Sleep -Seconds 15
          pm2 status

      - name: Probe live endpoints
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @(
            @{ Name='API'; Url='http://127.0.0.1:3000/' },
            @{ Name='Command Center'; Url='http://127.0.0.1:8787/api/health' },
            @{ Name='CEO Dashboard'; Url='http://127.0.0.1:8737/api/state' },
            @{ Name='CEO Revenue'; Url='http://127.0.0.1:8737/api/revenue' },
            @{ Name='CEO Growth Assets'; Url='http://127.0.0.1:8737/api/growth-assets' },
            @{ Name='Desktop UI'; Url='http://127.0.0.1:3737/api/status' },
            @{ Name='Customer Delivery'; Url='http://127.0.0.1:8792/api/health' },
            @{ Name='Revenue Command Center'; Url='http://127.0.0.1:8792/api/revenue' }
          )
          foreach ($check in $checks) {
            $response = Invoke-WebRequest -UseBasicParsing -Uri $check.Url -TimeoutSec 30
            if ($response.StatusCode -ne 200) { throw "$($check.Name) failed HTTP probe: $($response.StatusCode)" }
            Write-Host "[HTTP PASS] $($check.Name) $($check.Url)"
          }

      - name: Run MILES live command acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestMilesProductionRecoveryAcceptanceP0.js
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path .\DATA\runtime_guardian\production_recovery_acceptance_latest.json) { Get-Content .\DATA\runtime_guardian\production_recovery_acceptance_latest.json -Raw | Write-Host }
            throw 'MILES live command acceptance failed.'
          }

      - name: Run whole-system acceptance matrix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestP2GCWholeSystemAcceptanceP0.js
          if (Test-Path .\DATA\runtime_guardian\whole_system_acceptance_latest.json) { Get-Content .\DATA\runtime_guardian\whole_system_acceptance_latest.json -Raw | Write-Host }
          if ($LASTEXITCODE -ne 0) { throw 'Whole-system internal acceptance failed.' }

      - name: Run CEO Dashboard command path acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestMilesFinalSurfaceAcceptanceP0.js
          if (Test-Path .\DATA\runtime_guardian\final_surface_acceptance_latest.json) { Get-Content .\DATA\runtime_guardian\final_surface_acceptance_latest.json -Raw | Write-Host }
          $report = Get-Content .\DATA\runtime_guardian\final_surface_acceptance_latest.json -Raw | ConvertFrom-Json
          $coreFailures = @($report.checks | Where-Object { -not $_.ok -and $_.name -notmatch 'P2GC prospect demo' -and $_.name -notmatch 'p2gc-growth-demo' })
          if ($coreFailures.Count -gt 0) {
            $coreFailures | ConvertTo-Json -Depth 6 | Write-Host
            throw 'CEO/core/customer-delivery final surface acceptance failed.'
          }
          Write-Host '[CORE E2E PASS] CEO Dashboard -> Command Center -> TaskQueue -> worker -> persisted result + customer/growth layer'

      - name: Persist PM2 map and show logs
        if: always()
        shell: powershell
        run: |
          pm2 status 2>&1 | Out-Host
          pm2 logs --nostream --lines 100 2>&1 | Out-Host
