name: MILES Windows Runtime E2E

on:
  push:
    branches:
      - agent/miles-full-system-reconciliation-20260815
  workflow_dispatch:

concurrency:
  group: miles-runtime-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-runtime-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MILES_ROOT: ${{ github.workspace }}
      MILES_API_PORT: '3000'
      MILES_COMMAND_PORT: '8787'
      MILES_COMMAND_CENTER_PORT: '8787'
      MILES_DASHBOARD_PORT: '8737'
      MILES_PORT: '3737'
      P2GC_CUSTOMER_PORT: '8792'
      P2GC_GROWTH_DEMO_PORT: '8791'
      MILES_AUTONOMOUS_INTERVAL_MS: '600000'
      MILES_AUTONOMOUS_WORK_INTERVAL_MS: '600000'
      MILES_INFRASTRUCTURE_HEALTH_INTERVAL_MS: '600000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install repository dependencies and PM2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed.' }
          npm install -g pm2
          if ($LASTEXITCODE -ne 0) { throw 'PM2 install failed.' }
          $pm2Cli = (& node -e "process.stdout.write(require('./SCRIPTS/ReconcilePm2Process').resolvePm2Cli())").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $pm2Cli -or -not (Test-Path $pm2Cli -PathType Leaf)) { throw "Production PM2 resolver failed: $pm2Cli" }
          $env:MILES_PM2_CLI = $pm2Cli
          "MILES_PM2_CLI=$pm2Cli" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "[PM2 CLI] production resolver found $pm2Cli"

      - name: Prove direct PM2 state access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\Pm2DirectCommand.js jlist | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Direct PM2 state query failed.' }
          Write-Host '[PM2] clean runner state reachable through direct Node transport'

      - name: Run isolated P2GC and deployment acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestDashboardPromotionClosureP0.js
          if ($LASTEXITCODE -ne 0) { throw 'CEO Dashboard promotion closure failed.' }
          node .\SCRIPTS\TestDashboardDeploymentSimulationP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Stale-local CEO Dashboard deployment simulation failed.' }
          node .\TESTS\TestProviderAuthorityEnvironmentP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Provider authority environment truth failed.' }
          node .\TESTS\TestExecutionActionContractsP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Dependency-free execution action contract failed.' }
          node .\TESTS\TestConnectorActionContractRuntimeP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Runtime connector action contract failed.' }
          node .\TESTS\TestCommandPreflightP0.js
          if ($LASTEXITCODE -ne 0) { throw 'CEO command preflight failed.' }
          node .\TESTS\TestBusinessWorkPlannerExecutionContractP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Business work planner execution contract failed.' }
          node .\TESTS\TestExecutiveMissionExecutionP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Read-only executive mission semantics failed.' }
          node .\TESTS\TestEphemeralConnectorBootstrapP0.js
          if ($LASTEXITCODE -ne 0) { throw 'Ephemeral connector bootstrap acceptance failed.' }
          node .\SCRIPTS\TestP2GCCustomerDeliveryAcceptanceP0.js
          if ($LASTEXITCODE -ne 0) { throw 'P2GC customer delivery acceptance failed.' }
          node .\SCRIPTS\TestP2GCGrowthAssetsAcceptanceP0.js
          if ($LASTEXITCODE -ne 0) { throw 'P2GC growth asset acceptance failed.' }
          node .\TESTS\TestWorkerExecutionBridgeBootstrap.js
          if ($LASTEXITCODE -ne 0) { throw 'Worker bootstrap/self-development acceptance failed.' }

      - name: Start canonical MILES and P2GC surfaces
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\ReconcileMilesProductionSurfaces.js miles-api miles-worker miles-command-center miles-executive-dashboard miles-desktop-ui miles-autonomous-coo p2gc-customer-delivery p2gc-growth-demo
          if ($LASTEXITCODE -ne 0) { throw 'Unable to start canonical MILES/P2GC surfaces.' }
          Start-Sleep -Seconds 15
          node .\SCRIPTS\Pm2DirectCommand.js status | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query PM2 through direct transport.' }

      - name: Probe live endpoints with Node protocol client
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestMilesCoreHttpProbeP0.js
          if ($LASTEXITCODE -ne 0) { throw 'MILES/P2GC Node HTTP probe failed.' }

      - name: Run MILES live command acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestMilesProductionRecoveryAcceptanceP0.js
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path .\DATA\runtime_guardian\production_recovery_acceptance_latest.json) { Get-Content .\DATA\runtime_guardian\production_recovery_acceptance_latest.json -Raw | Write-Host }
            throw 'MILES live command acceptance failed.'
          }

      - name: Run whole-system acceptance matrix
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestP2GCWholeSystemAcceptanceP0.js
          if (Test-Path .\DATA\runtime_guardian\whole_system_acceptance_latest.json) { Get-Content .\DATA\runtime_guardian\whole_system_acceptance_latest.json -Raw | Write-Host }
          if ($LASTEXITCODE -ne 0) { throw 'Whole-system internal acceptance failed.' }

      - name: Run CEO Dashboard command path acceptance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node .\SCRIPTS\TestMilesFinalSurfaceAcceptanceP0.js
          if (Test-Path .\DATA\runtime_guardian\final_surface_acceptance_latest.json) { Get-Content .\DATA\runtime_guardian\final_surface_acceptance_latest.json -Raw | Write-Host }
          $report = Get-Content .\DATA\runtime_guardian\final_surface_acceptance_latest.json -Raw | ConvertFrom-Json
          $failures = @($report.checks | Where-Object { -not $_.ok })
          if ($failures.Count -gt 0) {
            $failures | ConvertTo-Json -Depth 6 | Write-Host
            throw 'Final MILES/P2GC surface and CEO command acceptance failed.'
          }
          Write-Host '[FULL E2E PASS] CEO Dashboard -> Command preflight -> Command Center -> TaskQueue -> ephemeral connector bootstrap -> worker -> successful read-only result with zero external side effects + customer/growth/demo layer'

      - name: Persist PM2 map and show logs through direct transport
        if: always()
        shell: powershell
        run: |
          node .\SCRIPTS\Pm2DirectCommand.js save | Out-Host
          node .\SCRIPTS\Pm2DirectCommand.js status | Out-Host
          node .\SCRIPTS\Pm2DirectCommand.js logs --nostream --lines 120 | Out-Host
