name: Apply Remote Runtime Approval Audit Once

on:
  push:
    branches:
      - 'fix/remote-runtime-approval-audit-20260829'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remote-runtime-approval-audit-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check repair
        run: node --check SCRIPTS/RepairRemoteRuntimeApprovalAuditAllowlist.js
      - name: Dry run repair
        run: node SCRIPTS/RepairRemoteRuntimeApprovalAuditAllowlist.js
      - name: Apply repair
        run: node SCRIPTS/RepairRemoteRuntimeApprovalAuditAllowlist.js --apply
      - name: Validate source
        shell: bash
        run: |
          node --check StartMilesRemoteExecutionBridge.js
          node --check SCRIPTS/AuditRuntimeApprovalBacklog.js
          node --check TESTS/remote_execution_bridge_safety.test.js
          grep -Fq "COO_RUNTIME_APPROVAL_AUDIT: ['node', ['SCRIPTS/AuditRuntimeApprovalBacklog.js']]" StartMilesRemoteExecutionBridge.js
          grep -Fq "'COO_RUNTIME_APPROVAL_AUDIT'" TESTS/remote_execution_bridge_safety.test.js
          grep -Fq "readOnly: true" SCRIPTS/AuditRuntimeApprovalBacklog.js
          grep -Fq "filesChanged: 0" SCRIPTS/AuditRuntimeApprovalBacklog.js
          grep -Fq "processesRestarted: 0" SCRIPTS/AuditRuntimeApprovalBacklog.js
          echo REMOTE_RUNTIME_APPROVAL_AUDIT_SOURCE_PASS
      - name: Commit allowlist
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js TESTS/remote_execution_bridge_safety.test.js
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Allowlist read-only runtime approval audit'
            git push origin HEAD:fix/remote-runtime-approval-audit-20260829
          fi
