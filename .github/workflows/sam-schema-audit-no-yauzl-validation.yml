name: SAM Schema Audit No Yauzl Validation
on:
  push:
    branches:
      - 'fix/sam-schema-audit-no-yauzl-20260830'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check SCRIPTS/InspectSamBulkSchema.js
      - run: |
          if grep -q "require('yauzl')" SCRIPTS/InspectSamBulkSchema.js; then exit 1; fi
          grep -q "System.IO.Compression.FileSystem" SCRIPTS/InspectSamBulkSchema.js
          grep -q "externalNodeZipDependency:false" SCRIPTS/InspectSamBulkSchema.js
