name: Apply SAM SQLite Recovery Once
on:
  push:
    branches:
      - 'feature/sam-expanded-email-recovery-20260830'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sam-expanded-email-recovery-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dry run bridge allowlist repair
        run: node SCRIPTS/RepairSamSqliteRecoveryAllowlist.js
      - name: Apply bridge allowlist repair
        run: node SCRIPTS/RepairSamSqliteRecoveryAllowlist.js --apply
      - name: Validate syntax and safety contracts
        run: |
          node --check SERVICES/orion/SamSqliteEmailRecoveryService.js
          node --check SCRIPTS/RecoverSamQualifiedEmailsFromSqlite.js
          node --check StartMilesRemoteExecutionBridge.js
          node - <<'NODE'
          const s=require('./SERVICES/orion/SamSqliteEmailRecoveryService');
          if(!s.validEmail('person@company.com')) throw new Error('commercial email rejected');
          if(s.validEmail('person@agency.gov')) throw new Error('government email accepted');
          if(!s.strictVerified('deliverable')) throw new Error('deliverable status not recognized');
          if(s.strictVerified('active')) throw new Error('generic active status incorrectly verified');
          console.log('SAM_SQLITE_RECOVERY_SAFETY=PASS');
          NODE
      - name: Commit bridge repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js
          if git diff --cached --quiet; then echo 'No bridge changes required.'; else git commit -m 'Allow governed SAM SQLite email recovery'; git push origin HEAD:feature/sam-expanded-email-recovery-20260830; fi
