name: MILES Cutover Rehearsal Validation

on:
  pull_request:
    paths:
      - "StartMilesRehearsal.js"
      - "StartProductionSystemRehearsal.js"
      - "SCRIPTS/RUN_MILES_CUTOVER_REHEARSAL.ps1"
      - "SCRIPTS/RUN_MILES_CUTOVER_REHEARSAL_WINDOWS.ps1"
      - "SCRIPTS/RUN_MILES_CUTOVER_REHEARSAL_PM2_WINDOWS.ps1"
      - "TESTS/cutover_rehearsal_safety_test.js"
      - ".github/workflows/cutover-rehearsal-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check rehearsal entrypoints
        run: |
          node --check StartMilesRehearsal.js
          node --check StartProductionSystemRehearsal.js

      - name: Static rehearsal safety validation
        run: node TESTS/cutover_rehearsal_safety_test.js
