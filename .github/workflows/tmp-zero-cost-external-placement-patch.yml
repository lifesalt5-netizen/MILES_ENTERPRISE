name: Temp zero-cost external placement patch
on:
  push:
    branches:
      - feat/zero-cost-external-placement-20260902
    paths:
      - .github/workflows/tmp-zero-cost-external-placement-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/zero-cost-external-placement-20260902
      - name: Patch audit and fixed bridge allowlist
        run: python .github/scripts/tmp_zero_cost_external_patch.py
      - name: Commit patch
        run: |
          git config user.name "lifesalt5-netizen"
          git config user.email "lifesalt5@gmail.com"
          git add SCRIPTS/AUDIT_OUTBOUND_SENDER_CAPACITY_V2.js StartMilesRemoteExecutionBridge.js TESTS/remote_execution_bridge_safety.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate zero-cost external placement evidence"
          git push origin HEAD:feat/zero-cost-external-placement-20260902
