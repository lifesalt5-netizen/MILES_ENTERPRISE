name: P2GC Intent Lead Engine Validation

on:
  pull_request:
    paths:
      - 'SERVICES/revenue/P2GCIntentLeadCanonicalService.js'
      - 'SERVICES/revenue/P2GCWarmPipelineContractService.js'
      - 'SERVICES/revenue/P2GCIntentLeadPipelineService.js'
      - 'SERVICES/revenue/P2GCIntentBusinessDayRunner.js'
      - 'SERVICES/revenue/P2GCIntentLiveSourceIngestionService.js'
      - 'SCRIPTS/UpsertP2GCWarmPipelineWorkbook.ps1'
      - 'TESTS/p2gc_intent_lead_*'
      - 'TESTS/p2gc_intent_business_day_runner_test.js'
      - 'TESTS/p2gc_intent_live_source_ingestion_test.js'
      - 'TESTS/Test_P2GCWarmPipelineWorkbookUpsert.ps1'
      - '.github/workflows/p2gc-intent-lead-engine.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check SERVICES/revenue/P2GCIntentLeadCanonicalService.js
          node --check SERVICES/revenue/P2GCWarmPipelineContractService.js
          node --check SERVICES/revenue/P2GCIntentLeadPipelineService.js
          node --check SERVICES/revenue/P2GCIntentBusinessDayRunner.js
          node --check SERVICES/revenue/P2GCIntentLiveSourceIngestionService.js
          node --check TESTS/p2gc_intent_lead_canonical_test.js
          node --check TESTS/p2gc_intent_lead_warm_pipeline_contract_test.js
          node --check TESTS/p2gc_intent_lead_pipeline_test.js
          node --check TESTS/p2gc_intent_business_day_runner_test.js
          node --check TESTS/p2gc_intent_live_source_ingestion_test.js
      - name: Canonical intent qualification and dedupe
        run: node TESTS/p2gc_intent_lead_canonical_test.js
      - name: Warm Pipeline mapping and upsert contract
        run: node TESTS/p2gc_intent_lead_warm_pipeline_contract_test.js
      - name: Governed canonical-to-Warm-Pipeline orchestration
        run: node TESTS/p2gc_intent_lead_pipeline_test.js
      - name: Governed once-per-business-day execution gate
        run: node TESTS/p2gc_intent_business_day_runner_test.js
      - name: Governed live public-source ingestion
        run: node TESTS/p2gc_intent_live_source_ingestion_test.js

  xlsx-upsert-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 parse validation
        shell: powershell
        run: |
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\SCRIPTS\UpsertP2GCWarmPipelineWorkbook.ps1'),[ref]$null,[ref]$errors)
          if($errors){ $errors | Format-List | Out-String | Write-Error; exit 2 }
      - name: Functional XLSX append update dedupe acceptance
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\TESTS\Test_P2GCWarmPipelineWorkbookUpsert.ps1
