name: Apply SAM Bulk Schema Audit Bridge Once
on:
  push:
    branches:
      - 'fix/sam-bulk-schema-audit-20260830'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sam-bulk-schema-audit-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node SCRIPTS/RepairSamBulkSchemaAuditBridge.js
      - run: node SCRIPTS/RepairSamBulkSchemaAuditBridge.js --apply
      - run: |
          node --check StartMilesRemoteExecutionBridge.js
          node --check SCRIPTS/InspectSamBulkSchema.js
          grep -q "SAM_BULK_SCHEMA_AUDIT" StartMilesRemoteExecutionBridge.js
          grep -q "Every outbound-eligible lead must have a verified deliverable commercial email" DATA/control/sam_refresh_retention_and_email_rules_20260830.md
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js
          if git diff --cached --quiet; then echo 'No source changes required.'; else git commit -m 'Allow remote SAM bulk schema audit'; git push origin HEAD:fix/sam-bulk-schema-audit-20260830; fi
