name: Guarded Instantly Reply Send

on:
  pull_request:
    paths:
      - 'CORE/ExecutionActionContracts.js'
      - 'CONNECTORS/INSTANTLY/connector.js'
      - 'SERVICES/revenue/AutonomousQualifiedReplyPolicy.js'
      - 'TESTS/Test_InstantlyGuardedReplySend.js'
      - 'TESTS/Test_AutonomousQualifiedReplyPolicy.js'
      - 'TESTS/Test_GuardedReplySendEndToEndContract.js'
      - 'SCRIPTS/Audit_AutonomousReplySendReadiness.js'
      - '.github/workflows/guarded-reply-send-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Syntax
        run: |
          node --check CORE/ExecutionActionContracts.js
          node --check CONNECTORS/INSTANTLY/connector.js
          node --check SERVICES/revenue/AutonomousQualifiedReplyPolicy.js
          node --check TESTS/Test_InstantlyGuardedReplySend.js
          node --check TESTS/Test_AutonomousQualifiedReplyPolicy.js
          node --check TESTS/Test_GuardedReplySendEndToEndContract.js
          node --check SCRIPTS/Audit_AutonomousReplySendReadiness.js
      - name: Guarded reply regression
        run: node TESTS/Test_InstantlyGuardedReplySend.js
      - name: Qualified reply policy
        run: node TESTS/Test_AutonomousQualifiedReplyPolicy.js
      - name: End-to-end guarded reply contract
        run: node TESTS/Test_GuardedReplySendEndToEndContract.js
      - name: Readiness audit
        run: node SCRIPTS/Audit_AutonomousReplySendReadiness.js
