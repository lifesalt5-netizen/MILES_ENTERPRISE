name: Patch FY2026 Sidecar Source Date

on:
  push:
    branches:
      - fix/fy2026-sidecar-source-date-20260901

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fy2026-sidecar-source-date-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Patch source-date resolver and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('SERVICES/revenue/Fy2026AwardedUniverseCoverageService.js')
          s = p.read_text()
          anchor = "function readJson(file) { return JSON.parse(fs.readFileSync(file, 'utf8').replace(/^\\uFEFF/, '')); }\n"
          helper = """function sourceDateFromText(value) {\n  const text = clean(value);\n  const matches = [...text.matchAll(/(?:^|[^0-9])(20[0-9]{2})(0[1-9]|1[0-2])([0-2][0-9]|3[01])(?:[^0-9]|$)/g)];\n  for (const match of matches) {\n    const candidate = `${match[1]}-${match[2]}-${match[3]}`;\n    const parsed = isoDate(candidate);\n    if (parsed === candidate) return candidate;\n  }\n  return null;\n}\nfunction resolveSourceUpdatedDate(report, sourceRows) {\n  const explicit = isoDate(report?.source?.updatedDate || (sourceRows || []).map(row => row.source_updated_date).find(Boolean));\n  if (explicit) return { date: explicit, authority: 'EXPLICIT_SOURCE_UPDATED_DATE' };\n  const archiveCandidates = [\n    report?.source?.archive,\n    ...(sourceRows || []).map(row => row.source_archive)\n  ].filter(Boolean);\n  for (const archive of archiveCandidates) {\n    const parsed = sourceDateFromText(archive);\n    if (parsed) return { date: parsed, authority: 'VALIDATED_SOURCE_ARCHIVE_FILENAME_DATE', archive: clean(archive) };\n  }\n  return { date: null, authority: 'UNRESOLVED' };\n}\n"""
          if 'function resolveSourceUpdatedDate(' not in s:
              if anchor not in s:
                  raise SystemExit('helper anchor missing')
              s = s.replace(anchor, anchor + helper, 1)
          old = "      const sourceUpdatedDate = isoDate(report?.source?.updatedDate || sourceRows.map(row => row.source_updated_date).find(Boolean));\n      if (!sourceUpdatedDate) throw new Error('ORION_FY2026_SOURCE_DATE_UNKNOWN');\n"
          new = "      const resolvedSourceDate = resolveSourceUpdatedDate(report, sourceRows);\n      const sourceUpdatedDate = resolvedSourceDate.date;\n      if (!sourceUpdatedDate) throw new Error('ORION_FY2026_SOURCE_DATE_UNKNOWN');\n"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('source date assignment anchor missing')
          ret = "        sourceUpdatedDate,\n        primeUeis,\n"
          ret2 = "        sourceUpdatedDate,\n        sourceDateAuthority: resolvedSourceDate,\n        primeUeis,\n"
          if ret in s:
              s = s.replace(ret, ret2, 1)
          elif ret2 not in s:
              raise SystemExit('return anchor missing')
          scope = "          endDate,\n          primeAuthority: 'ORION_VALIDATED_USASPENDING_FY2026_SIDECAR',\n"
          scope2 = "          endDate,\n          primeSourceDateAuthority: prime.sourceDateAuthority,\n          primeAuthority: 'ORION_VALIDATED_USASPENDING_FY2026_SIDECAR',\n"
          if scope in s:
              s = s.replace(scope, scope2, 1)
          elif scope2 not in s:
              raise SystemExit('scope anchor missing')
          p.write_text(s)

          t = Path('TESTS/Test_Fy2026AwardedUniverseCoverageService.js')
          x = t.read_text()
          old_report = "    source: { updatedDate: '2026-08-31' },\n"
          new_report = "    source: { updatedDate: null, archive: 'FY2026_All_Contracts_Full_20260831.zip' },\n"
          if old_report in x:
              x = x.replace(old_report, new_report, 1)
          elif new_report not in x:
              raise SystemExit('test report anchor missing')
          explicit_row = "source_updated_date: '2026-08-31', contractor_summary_rows: 3"
          fallback_row = "source_updated_date: null, source_archive: 'FY2026_All_Contracts_Full_20260831.zip', contractor_summary_rows: 3"
          if explicit_row in x:
              x = x.replace(explicit_row, fallback_row, 1)
          elif fallback_row not in x:
              raise SystemExit('source row fixture anchor missing')
          assertion = "  assert.strictEqual(green.awardedUniverse.exactUniquePrimeAwardedUeis, 3);\n"
          extra = "  assert.strictEqual(green.scope.endDate, '2026-08-31');\n  assert.strictEqual(green.scope.primeSourceDateAuthority.authority, 'VALIDATED_SOURCE_ARCHIVE_FILENAME_DATE');\n"
          if extra not in x:
              if assertion not in x:
                  raise SystemExit('test assertion anchor missing')
              x = x.replace(assertion, extra + assertion, 1)
          t.write_text(x)
          PY
      - name: Validate bounded source-date repair
        run: |
          node --check SERVICES/revenue/Fy2026AwardedUniverseCoverageService.js
          node --check TESTS/Test_Fy2026AwardedUniverseCoverageService.js
          node TESTS/Test_Fy2026AwardedUniverseCoverageService.js
          node TESTS/remote_execution_bridge_safety.test.js
          grep -F "VALIDATED_SOURCE_ARCHIVE_FILENAME_DATE" SERVICES/revenue/Fy2026AwardedUniverseCoverageService.js
      - name: Commit bounded repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'MILES CI'
          git config user.email 'miles-ci@local.invalid'
          git add SERVICES/revenue/Fy2026AwardedUniverseCoverageService.js TESTS/Test_Fy2026AwardedUniverseCoverageService.js
          git commit -m 'Resolve FY2026 sidecar date from validated archive metadata'
          git push origin HEAD:fix/fy2026-sidecar-source-date-20260901
