name: Apply SAM Current Send Collision Audit Once
on:
  push:
    branches:
      - 'feature/sam-current-send-collision-audit-20260830'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sam-current-send-collision-audit-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node SCRIPTS/RepairSamCollisionAuditAllowlist.js
      - run: node SCRIPTS/RepairSamCollisionAuditAllowlist.js --apply
      - name: Validate syntax and static safety contracts
        run: |
          node --check SERVICES/orion/SamCurrentSendCollisionAuditService.js
          node --check SCRIPTS/AuditSamCurrentSendCollisions.js
          node --check StartMilesRemoteExecutionBridge.js
          grep -q "SAM_CURRENT_SEND_COLLISION_AUDIT" StartMilesRemoteExecutionBridge.js
          grep -q "providerMutations:false" SERVICES/orion/SamCurrentSendCollisionAuditService.js
          grep -q "oldSamDeleted:false" SERVICES/orion/SamCurrentSendCollisionAuditService.js
          grep -q "emailValuesLogged:false" SERVICES/orion/SamCurrentSendCollisionAuditService.js
          grep -q "currentSendSegmentsModified:false" SERVICES/orion/SamCurrentSendCollisionAuditService.js
          echo SAM_CURRENT_SEND_COLLISION_AUDIT_STATIC_SAFETY=PASS
      - name: Commit bridge allowlist repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js
          if git diff --cached --quiet; then echo 'No bridge changes required.'; else git commit -m 'Allow read-only SAM current-send collision audit'; git push origin HEAD:feature/sam-current-send-collision-audit-20260830; fi
