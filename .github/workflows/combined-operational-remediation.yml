      - 'TESTS/Test_GroupedRemediationV2.js'
      - 'TESTS/Test_InstantlyGuardedReplySend.js'
      - 'TESTS/Test_SamQualifiedProspectFallbackService.js'
      - 'TESTS/instantly_lifecycle_provider_proof.test.js'
      - 'TESTS/instantly_sender_failover.test.js'
      - 'TESTS/instantly_inbox_placement_controlled_test.test.js'
      - 'TESTS/instantly_inbox_placement_diagnostic_truth.test.js'
      - 'TESTS/instantly_inbox_placement_auth_governance.test.js'
      - 'TESTS/namecheap_dmarc_remediation.test.js'
      - 'TESTS/executive_response_service.test.js'
      - 'TESTS/unified_miles_gateway.test.js'
      - 'TESTS/ceo_surface_screen_acceptance.test.js'
      - 'TESTS/production_truth_reconciliation.test.js'
      - 'TESTS/repository_risk_qualification.test.js'
      - 'TESTS/orion_rebuild_readiness.test.js'
      - '.github/workflows/combined-operational-remediation.yml'
  workflow_dispatch:

jobs:
  node-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: |
          node --check CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V12.js
          node --check CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V13.js
          node --check CONNECTORS/WEBSITE_B12/B12_AUTH_AND_STAGE_SINGLE_SESSION.js
          node --check CONNECTORS/IONOS/imap_governed.js
          node --check CONNECTORS/INSTANTLY/connector.js
          node --check SERVICES/revenue/IonosInboxCleanupService.js
          node --check SERVICES/revenue/InstantlyLifecycleReconciler.js
          node --check SERVICES/revenue/InstantlyLifecycleProofService.js
          node --check SERVICES/revenue/InstantlySenderFailoverService.js
          node --check SERVICES/revenue/InstantlyInboxPlacementTestService.js
          node --check SERVICES/revenue/ReplyIntelligenceService.js
          node --check SERVICES/ExecutiveResponseService.js
          node --check SERVICES/ProductionTruthReconciliationService.js
          node --check SERVICES/RepositoryRiskQualificationService.js
          node --check SERVICES/orion/OrionRebuildReadinessService.js
          node --check SERVICES/digital_coo/public/app.js
          node --check SERVICES/digital_coo/UnifiedMilesGateway.js
          node --check SERVICES/demo/SamQualifiedProspectFallbackService.js
          node --check SERVICES/demo/DemoTruthReconciliationService.js
          node --check StartP2GCGrowthBlueprintDemo.js
          node --check SCRIPTS/AuditLiveP2GCDemoAcceptance.js
          node --check SCRIPTS/AuditInstantlySendWindowHistory.js
          node --check SCRIPTS/AuditInstantlyInboxPlacement.js
          node --check SCRIPTS/CreateControlledInstantlyInboxPlacementTest.js
          node --check SCRIPTS/DiagnoseInstantlyInboxPlacementTest.js
          node --check SCRIPTS/RemediateNamecheapDmarc.js
          node --check SCRIPTS/AuditUnified8787ScreenAcceptance.js
          node --check SCRIPTS/AuditOrionRefreshSources.js
          node --check SCRIPTS/AuditOrionRebuildReadiness.js
          node --check SCRIPTS/QualifyRepositoryRisks.js
          node --check SCRIPTS/ReconcileProductionTruth.js
          node --check RUN_OPERATIONAL_REMEDIATION_ALL.js
          node --check TESTS/Test_OperationalRemediationPack.js
          node --check TESTS/Test_GroupedRemediationV2.js
          node --check TESTS/Test_InstantlyGuardedReplySend.js
          node --check TESTS/Test_SamQualifiedProspectFallbackService.js
          node --check TESTS/instantly_lifecycle_provider_proof.test.js
          node --check TESTS/instantly_sender_failover.test.js
          node --check TESTS/instantly_inbox_placement_controlled_test.test.js
          node --check TESTS/instantly_inbox_placement_diagnostic_truth.test.js
          node --check TESTS/instantly_inbox_placement_auth_governance.test.js
          node --check TESTS/namecheap_dmarc_remediation.test.js
          node --check TESTS/executive_response_service.test.js
          node --check TESTS/unified_miles_gateway.test.js
          node --check TESTS/ceo_surface_screen_acceptance.test.js
          node --check TESTS/production_truth_reconciliation.test.js
          node --check TESTS/repository_risk_qualification.test.js
          node --check TESTS/orion_rebuild_readiness.test.js
      - name: Static safety contract
        run: |
          node TESTS/Test_OperationalRemediationPack.js
          node TESTS/Test_GroupedRemediationV2.js
          node TESTS/Test_InstantlyGuardedReplySend.js
          node TESTS/Test_SamQualifiedProspectFallbackService.js
          node TESTS/instantly_sender_failover.test.js
          node TESTS/instantly_inbox_placement_controlled_test.test.js
          node TESTS/instantly_inbox_placement_diagnostic_truth.test.js
          node TESTS/instantly_inbox_placement_auth_governance.test.js
          node TESTS/namecheap_dmarc_remediation.test.js
          node --test TESTS/executive_response_service.test.js
          node TESTS/unified_miles_gateway.test.js
          node TESTS/ceo_surface_screen_acceptance.test.js
          node TESTS/production_truth_reconciliation.test.js
          node TESTS/repository_risk_qualification.test.js
          node TESTS/orion_rebuild_readiness.test.js

  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'SCRIPTS\\RunOperationalRemediationAll.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List *; exit 1 }
          Write-Host 'COMBINED_OPERATIONAL_REMEDIATION_POWERSHELL51=GREEN'
