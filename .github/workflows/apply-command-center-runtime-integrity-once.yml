name: Apply Command Center Runtime Integrity Once

on:
  push:
    branches:
      - 'fix/apply-command-center-runtime-integrity-20260829'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/apply-command-center-runtime-integrity-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded repair
        run: node SCRIPTS/RepairCommandCenterRuntimeIntegrity.js --apply
      - name: Validate patched production JavaScript
        run: |
          node --check SERVICES/digital_coo/MilesCommandCenter.js
          node --check SERVICES/ceo_dashboard/public/ceo.js
          node --check SERVICES/digital_coo/public/app.js
      - name: Verify expected repair markers
        run: |
          grep -q 'function reconcileRuntimeApprovals()' SERVICES/digital_coo/MilesCommandCenter.js
          grep -q 'APPROVED_AND_RESUMED' SERVICES/digital_coo/MilesCommandCenter.js
          grep -q '/execution?operationId=' SERVICES/ceo_dashboard/public/ceo.js
          grep -q 'initialOperationId' SERVICES/digital_coo/public/app.js
      - name: Commit repaired sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SERVICES/digital_coo/MilesCommandCenter.js SERVICES/ceo_dashboard/public/ceo.js SERVICES/digital_coo/public/app.js
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Apply Command Center approval/runtime integrity repair'
            git push origin HEAD:fix/apply-command-center-runtime-integrity-20260829
          fi
