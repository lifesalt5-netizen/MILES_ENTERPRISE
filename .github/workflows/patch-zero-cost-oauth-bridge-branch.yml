name: Patch Zero-Cost OAuth Bridge Branch

on:
  push:
    branches:
      - feat/instantly-zero-cost-oauth-batch-runtime-20260902

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/instantly-zero-cost-oauth-batch-runtime-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch exact bridge allowlist and safety contract
        shell: python
        run: |
          from pathlib import Path

          bridge = Path('StartMilesRemoteExecutionBridge.js')
          text = bridge.read_text(encoding='utf-8')
          job = "  INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING: ['node', ['SCRIPTS/RunInstantlyGoogleOAuthZeroCostMissingBatch.js', '--authorization', 'AUTHORIZE_ZERO_COST_PAID_SENDER_GOOGLE_OAUTH']],\n"
          needle = "  INSTANTLY_LIFECYCLE_PROOF_EXECUTE: ['node', ['SCRIPTS/RunInstantlyLifecycleProof.js', '--execute']],\n"
          if 'INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING' not in text:
              if needle not in text:
                  raise SystemExit('BRIDGE_INSERTION_NEEDLE_NOT_FOUND')
              text = text.replace(needle, needle + job, 1)
              bridge.write_text(text, encoding='utf-8')

          test = Path('TESTS/remote_execution_bridge_safety.test.js')
          src = test.read_text(encoding='utf-8')
          key_line = "  'INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING',\n"
          key_needle = "  'INSTANTLY_LIFECYCLE_PROOF_PLAN',\n"
          if key_line not in src:
              if key_needle not in src:
                  raise SystemExit('TEST_KEY_INSERTION_NEEDLE_NOT_FOUND')
              src = src.replace(key_needle, key_needle + key_line, 1)

          exact_assert = "assert.deepStrictEqual(bridge.JOBS.INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING, ['node', ['SCRIPTS/RunInstantlyGoogleOAuthZeroCostMissingBatch.js', '--authorization', 'AUTHORIZE_ZERO_COST_PAID_SENDER_GOOGLE_OAUTH']]);\n"
          exact_needle = "assert.deepStrictEqual(bridge.JOBS.INSTANTLY_LIFECYCLE_PROOF_EXECUTE, ['node', ['SCRIPTS/RunInstantlyLifecycleProof.js', '--execute']]);\n"
          if exact_assert not in src:
              if exact_needle not in src:
                  raise SystemExit('TEST_EXACT_ASSERT_NEEDLE_NOT_FOUND')
              src = src.replace(exact_needle, exact_needle + exact_assert, 1)

          valid_assert = "assert.strictEqual(bridge.validateDirective({id:'x',enabled:true,job:'INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING'}).ok, true);\n"
          valid_needle = "assert.strictEqual(bridge.validateDirective({id:'x',enabled:true,job:'INSTANTLY_LIFECYCLE_PROOF_EXECUTE'}).ok, true);\n"
          if valid_assert not in src:
              if valid_needle not in src:
                  raise SystemExit('TEST_VALIDATE_NEEDLE_NOT_FOUND')
              src = src.replace(valid_needle, valid_needle + valid_assert, 1)
          test.write_text(src, encoding='utf-8')
      - name: Validate patch before commit
        run: |
          node --check StartMilesRemoteExecutionBridge.js
          node --check SCRIPTS/RunInstantlyGoogleOAuthZeroCostMissingBatch.js
          node TESTS/instantly_google_oauth_zero_cost_missing_batch.test.js
          node TESTS/remote_execution_bridge_safety.test.js
      - name: Commit governed branch patch
        run: |
          if git diff --quiet; then
            echo "Patch already present."
            exit 0
          fi
          git config user.name "MILES GitHub Automation"
          git config user.email "miles-github-automation@local.invalid"
          git add StartMilesRemoteExecutionBridge.js TESTS/remote_execution_bridge_safety.test.js
          git commit -m "Allow governed zero-cost OAuth initialization runtime job"
          git push origin HEAD:feat/instantly-zero-cost-oauth-batch-runtime-20260902
