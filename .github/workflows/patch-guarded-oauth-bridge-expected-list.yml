name: Patch Guarded OAuth Bridge Expected List

on:
  push:
    branches:
      - feat/miles-google-oauth-browser-guarded-20260902

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/miles-google-oauth-browser-guarded-20260902
          fetch-depth: 0
      - name: Update exact allowlist inventory and validation assertion
        shell: python
        run: |
          from pathlib import Path
          p = Path('TESTS/remote_execution_bridge_safety.test.js')
          text = p.read_text(encoding='utf-8')
          list_anchor = "  'INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING',\n"
          list_add = "  'INSTANTLY_ZERO_COST_OAUTH_BROWSER_GUARDED',\n"
          if list_add not in text.split(']);',1)[0]:
              if list_anchor not in text: raise SystemExit('LIST_ANCHOR_NOT_FOUND')
              text = text.replace(list_anchor, list_anchor + list_add, 1)
          validate_anchor = "assert.strictEqual(bridge.validateDirective({id:'x',enabled:true,job:'INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING'}).ok, true);\n"
          validate_add = "assert.strictEqual(bridge.validateDirective({id:'x',enabled:true,job:'INSTANTLY_ZERO_COST_OAUTH_BROWSER_GUARDED'}).ok, true);\n"
          if validate_add not in text:
              if validate_anchor not in text: raise SystemExit('VALIDATE_ANCHOR_NOT_FOUND')
              text = text.replace(validate_anchor, validate_anchor + validate_add, 1)
          p.write_text(text, encoding='utf-8')
      - name: Verify and commit
        run: |
          node TESTS/remote_execution_bridge_safety.test.js
          git config user.name "MILES GitHub Automation"
          git config user.email "miles-github-automation@local.invalid"
          git add TESTS/remote_execution_bridge_safety.test.js
          git commit -m "Update guarded OAuth bridge allowlist contract"
          git push origin HEAD:feat/miles-google-oauth-browser-guarded-20260902
