name: P2GC Federal Growth Review Funnel Paths

on:
  push:
    paths:
      - 'SCRIPTS/DeployP2GCFederalGrowthReviewFunnelPaths.js'
      - '.github/workflows/p2gc-federal-growth-review-funnel-paths.yml'
  pull_request:
    paths:
      - 'SCRIPTS/DeployP2GCFederalGrowthReviewFunnelPaths.js'
      - '.github/workflows/p2gc-federal-growth-review-funnel-paths.yml'

jobs:
  prospect-only-funnel-router:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check transactional Funnel router
        run: node --check SCRIPTS/DeployP2GCFederalGrowthReviewFunnelPaths.js
      - name: Verify prospect-only routing safety contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('SCRIPTS/DeployP2GCFederalGrowthReviewFunnelPaths.js','utf8');
          const must=["{path:'/review'","{path:'/api/review'","--set-path=${entry.path}","'off'","P2GC_REVIEW_FUNNEL_PATHS_ROLLED_BACK","P2GC_PUBLIC_REVIEW_BASE_URL"];
          for(const x of must) if(!s.includes(x)) throw new Error('MISSING_SAFETY_MARKER:'+x);
          if(/funnel['\",\s]+reset|['\"]reset['\"]/.test(s)) throw new Error('FUNNEL_RESET_FORBIDDEN');
          if(/set-path[^\n]*api\/admin/i.test(s)) throw new Error('ADMIN_ROUTE_MOUNT_FORBIDDEN');
          if(!s.includes("adminBlocked")) throw new Error('ADMIN_BLOCK_ACCEPTANCE_REQUIRED');
          if(!s.includes("rootPreserved")) throw new Error('EXISTING_ROOT_ACCEPTANCE_REQUIRED');
          if(!s.includes("writeEnv(originalEnv)")) throw new Error('ENV_ROLLBACK_REQUIRED');
          console.log('P2GC_FUNNEL_ROUTER_SAFETY_GREEN');
          NODE
