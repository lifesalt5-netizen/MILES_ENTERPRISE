name: Apply ORION Contract Staging Build Once

on:
  push:
    branches:
      - 'feat/orion-contract-staging-build-20260830'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-contract-staging-build-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate sources
        run: |
          node --check SERVICES/orion/OrionContractStagingBuildService.js
          node --check SCRIPTS/BuildOrionContractStaging.js
          node --check SCRIPTS/RepairOrionContractStagingBuildAllowlist.js
          node TESTS/orion_contract_staging_build.test.js
          node SCRIPTS/RepairOrionContractStagingBuildAllowlist.js
      - name: Apply guarded allowlist repair
        run: node SCRIPTS/RepairOrionContractStagingBuildAllowlist.js --apply
      - name: Validate bridge
        run: |
          node --check StartMilesRemoteExecutionBridge.js
          grep -Fq "ORION_CONTRACT_STAGING_BUILD: ['node', ['SCRIPTS/BuildOrionContractStaging.js']]" StartMilesRemoteExecutionBridge.js
          echo ORION_CONTRACT_STAGING_BUILD_SOURCE_PASS
      - name: Commit bridge allowlist
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Allowlist ORION contract staging build'
            git push origin HEAD:feat/orion-contract-staging-build-20260830
          fi
