name: Patch Instantly OAuth Empty JSON Body

on:
  push:
    branches:
      - fix/instantly-oauth-empty-json-body-20260902

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/instantly-oauth-empty-json-body-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Patch OAuth init requests and regression assertions
        shell: python
        run: |
          from pathlib import Path

          scripts = [
              Path('SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js'),
              Path('SCRIPTS/RunInstantlyGoogleOAuthZeroCostMissingBatch.js'),
          ]
          old = "instantly.request('/oauth/google/init', { method: 'POST' })"
          new = "instantly.request('/oauth/google/init', { method: 'POST', body: {} })"
          for p in scripts:
              text = p.read_text(encoding='utf-8')
              if new not in text:
                  if old not in text:
                      raise SystemExit(f'OAUTH_INIT_NEEDLE_NOT_FOUND:{p}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          tests = [
              Path('TESTS/instantly_google_oauth_zero_cost_sender.test.js'),
              Path('TESTS/instantly_google_oauth_zero_cost_missing_batch.test.js'),
          ]
          assertion = "assert(src.includes(\"instantly.request('/oauth/google/init', { method: 'POST', body: {} })\"));\nassert(!src.includes(\"instantly.request('/oauth/google/init', { method: 'POST' })\"));\n"
          for p in tests:
              text = p.read_text(encoding='utf-8')
              if "body: {}" not in text:
                  anchor = "assert(src.includes(\"instantly.request('/oauth/google/init'\"));\n"
                  if anchor not in text:
                      raise SystemExit(f'OAUTH_TEST_ANCHOR_NOT_FOUND:{p}')
                  text = text.replace(anchor, anchor + assertion, 1)
              p.write_text(text, encoding='utf-8')
      - name: Validate OAuth request body contract
        run: |
          node --check SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js
          node --check SCRIPTS/RunInstantlyGoogleOAuthZeroCostMissingBatch.js
          node TESTS/instantly_google_oauth_zero_cost_sender.test.js
          node TESTS/instantly_google_oauth_zero_cost_missing_batch.test.js
      - name: Commit exact branch patch
        run: |
          if git diff --quiet; then
            echo "Patch already present."
            exit 0
          fi
          git config user.name "MILES GitHub Automation"
          git config user.email "miles-github-automation@local.invalid"
          git add SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js SCRIPTS/RunInstantlyGoogleOAuthZeroCostMissingBatch.js TESTS/instantly_google_oauth_zero_cost_sender.test.js TESTS/instantly_google_oauth_zero_cost_missing_batch.test.js
          git commit -m "Send explicit empty JSON body for Instantly OAuth init"
          git push origin HEAD:fix/instantly-oauth-empty-json-body-20260902
