name: Government Contractor Truth Toolchain

on:
  pull_request:
    paths:
      - 'CONFIG/government_contractor_truth_rules.json'
      - 'CONFIG/truth_recovered_verification_rules.json'
      - 'SCRIPTS/*GovernmentContractorTruth*.py'
      - 'SCRIPTS/*Truth*.py'
      - 'SCRIPTS/*Vehicle*.py'
      - 'SCRIPTS/RecoverNewVehicleContactsV2.py'
      - 'SCRIPTS/PrepareGovernmentContractorTruthVerificationIntake.js'
      - 'SCRIPTS/RunTruthRecoveredVerification.js'
      - 'SERVICES/revenue/GovernmentContractorTruthVerificationIntakeService.js'
      - 'SERVICES/revenue/RevenueEmailVerificationBatchService.js'
      - 'SERVICES/revenue/RevenueVerificationReconciliationService.js'
      - 'SERVICES/revenue/TruthRecoveredVerificationRunner.js'
      - 'TESTS/Test_GovernmentContractorTruthVerificationIntake.js'
      - 'TESTS/Test_RevenueEmailVerificationBatch.js'
      - 'TESTS/Test_RevenueVerificationReconciliation.js'
      - 'TESTS/Test_TruthRecoveredVerificationRunner.js'
      - '.github/workflows/government-contractor-truth-toolchain.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate truth toolchain when present
        shell: bash
        run: |
          if [ ! -f SCRIPTS/RecoverNewVehicleContactsV2.py ]; then
            echo 'TRUTH_TOOLCHAIN_NOT_PRESENT_YET=PASS'
            exit 0
          fi
          python -m py_compile SCRIPTS/AuditGovernmentContractorTruthIntegrity.py
          python -m py_compile SCRIPTS/AuditGovernmentContractorTruthSources.py
          python -m py_compile SCRIPTS/BuildGovernmentContractorTruthMaster.py
          python -m py_compile SCRIPTS/DiagnoseTruthRevenueAndIdentity.py
          python -m py_compile SCRIPTS/InspectAwardFYAndVehicleSchemas.py
          python -m py_compile SCRIPTS/MergeFreshNormalizedVehiclesV8.py
          python -m py_compile SCRIPTS/MergeMissingVehicleMembershipsV7.py
          python -m py_compile SCRIPTS/NormalizeFreshFederalVehicleSources.py
          python -m py_compile SCRIPTS/PullMissingFederalVehicleSources.py
          python -m py_compile SCRIPTS/RecoverGovernmentContractorContactsV1.py
          python -m py_compile SCRIPTS/RecoverNewVehicleContactsV2.py
          python -m py_compile SCRIPTS/RepairGovernmentContractorTruthMasterV2.py
          python -m py_compile SCRIPTS/RepairGovernmentContractorTruthMasterV3.py
          python -m py_compile SCRIPTS/RepairGovernmentContractorTruthMasterV4.py
          python -m py_compile SCRIPTS/RepairTruthVehicleSegmentsV5.py
          python -m py_compile SCRIPTS/RepairTruthVehicleSegmentsV6.py
          python - <<'PY'
          from pathlib import Path
          text=Path('SCRIPTS/RecoverNewVehicleContactsV2.py').read_text(encoding='utf-8').lower()
          assert 'verification_required' in text
          assert 'instantly' not in text
          assert 'activatecampaign' not in text
          assert 'sendemail' not in text
          print('GOVERNMENT_CONTRACTOR_TRUTH_RECOVERY_SAFETY=PASS')
          PY
      - name: Truth verification bridge syntax
        run: |
          node --check SERVICES/revenue/GovernmentContractorTruthVerificationIntakeService.js
          node --check SCRIPTS/PrepareGovernmentContractorTruthVerificationIntake.js
          node --check SERVICES/revenue/RevenueEmailVerificationBatchService.js
          node --check SERVICES/revenue/RevenueVerificationReconciliationService.js
          node --check SERVICES/revenue/TruthRecoveredVerificationRunner.js
          node --check SCRIPTS/RunTruthRecoveredVerification.js
      - name: Truth verification intake
        run: node TESTS/Test_GovernmentContractorTruthVerificationIntake.js
      - name: Verification batch merge and dedupe
        run: node TESTS/Test_RevenueEmailVerificationBatch.js
      - name: Verification reconciliation provenance
        run: node TESTS/Test_RevenueVerificationReconciliation.js
      - name: Governed verification credit runner
        run: node TESTS/Test_TruthRecoveredVerificationRunner.js
