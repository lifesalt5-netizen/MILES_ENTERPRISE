name: MILES Full Product Functional Acceptance

on:
  pull_request:
    paths:
      - "CONFIG/PRODUCTION_SYSTEM_GRAPH.json"
      - "CORE/ExecutionActionContracts.js"
      - "CONNECTORS/MILES/connector.js"
      - "SERVICES/BusinessWorkPlannerService.js"
      - "SERVICES/BusinessOperationsBridgeService.js"
      - "SERVICES/RevenueMissionSourceService.js"
      - "SERVICES/Discovery/CaptureCapacityRevenueDiscovery.js"
      - "SERVICES/digital_coo/public/app.js"
      - "SERVICES/revenue/CaptureCapacityProspectDiscoveryService.js"
      - "SERVICES/revenue/CaptureCapacityPublicWebSignalService.js"
      - "SERVICES/revenue/ReplyIntelligenceProductionLoopService.js"
      - "SERVICES/revenue/ReplyIntelligenceService.js"
      - "SERVICES/revenue/ExecutiveReplySurfacePolicyService.js"
      - "SERVICES/revenue/ReplacementContactRecoveryService.js"
      - "SERVICES/revenue/ReplacementContactBackfillService.js"
      - "RUN_REPLACEMENT_CONTACT_BACKFILL.js"
      - "StartP2GCGrowthBlueprintDemo.js"
      - "SERVICES/demo/**"
      - "SERVICES/teaming/**"
      - "SCRIPTS/AuditLiveP2GCDemoAcceptance.js"
      - "SCRIPTS/ProbeLiveDemoCanonicalCompany.js"
      - "SCRIPTS/ReconcileProductionTruth.js"
      - "TESTS/Test_LiveP2GCDemoAcceptance.js"
      - "TESTS/live_demo_canonical_company_probe.test.js"
      - "TESTS/Test_SamQualifiedProspectFallbackService.js"
      - "TESTS/full_product_functional_acceptance_test.js"
      - "TESTS/reply_intelligence_production_loop_test.js"
      - "TESTS/executive_reply_surface_policy_test.js"
      - "TESTS/replacement_contact_recovery_test.js"
      - "TESTS/replacement_contact_execution_test.js"
      - "TESTS/replacement_contact_backfill_test.js"
      - "TESTS/capture_capacity_public_web_signal_test.js"
      - ".github/workflows/full-product-functional-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Syntax validation
        run: |
          node --check CORE/ExecutionActionContracts.js
          node --check CONNECTORS/MILES/connector.js
          node --check SERVICES/BusinessWorkPlannerService.js
          node --check SERVICES/BusinessOperationsBridgeService.js
          node --check SERVICES/RevenueMissionSourceService.js
          node --check SERVICES/Discovery/CaptureCapacityRevenueDiscovery.js
          node --check SERVICES/digital_coo/public/app.js
          node --check SERVICES/revenue/CaptureCapacityProspectDiscoveryService.js
          node --check SERVICES/revenue/CaptureCapacityPublicWebSignalService.js
          node --check SERVICES/revenue/ReplyIntelligenceProductionLoopService.js
          node --check SERVICES/revenue/ReplyIntelligenceService.js
          node --check SERVICES/revenue/ExecutiveReplySurfacePolicyService.js
          node --check SERVICES/revenue/ReplacementContactRecoveryService.js
          node --check SERVICES/revenue/ReplacementContactBackfillService.js
          node --check SERVICES/demo/SamQualifiedProspectFallbackService.js
          node --check SERVICES/demo/DemoTruthReconciliationService.js
          node --check StartP2GCGrowthBlueprintDemo.js
          node --check RUN_REPLACEMENT_CONTACT_BACKFILL.js
          node --check SCRIPTS/AuditLiveP2GCDemoAcceptance.js
          node --check SCRIPTS/ProbeLiveDemoCanonicalCompany.js
          node --check SCRIPTS/ReconcileProductionTruth.js
          node --check TESTS/Test_LiveP2GCDemoAcceptance.js
          node --check TESTS/live_demo_canonical_company_probe.test.js
          node --check TESTS/Test_SamQualifiedProspectFallbackService.js
          node --check TESTS/full_product_functional_acceptance_test.js
          node --check TESTS/reply_intelligence_production_loop_test.js
          node --check TESTS/executive_reply_surface_policy_test.js
          node --check TESTS/replacement_contact_recovery_test.js
          node --check TESTS/replacement_contact_execution_test.js
          node --check TESTS/replacement_contact_backfill_test.js
          node --check TESTS/capture_capacity_public_web_signal_test.js

      - name: Full product semantic acceptance
        run: node TESTS/full_product_functional_acceptance_test.js

      - name: SAM-qualified demo identity fallback regression
        run: node TESTS/Test_SamQualifiedProspectFallbackService.js

      - name: Live demo acceptance regression
        run: node TESTS/Test_LiveP2GCDemoAcceptance.js

      - name: Live canonical company detail probe regression
        run: node TESTS/live_demo_canonical_company_probe.test.js

      - name: Reply intelligence semantic acceptance
        run: |
          node TESTS/executive_reply_surface_policy_test.js
          node TESTS/reply_intelligence_production_loop_test.js
          node TESTS/replacement_contact_recovery_test.js
          node TESTS/replacement_contact_execution_test.js
          node TESTS/replacement_contact_backfill_test.js

      - name: Capture Capacity regression suite
        run: |
          node TESTS/capture_capacity_autonomous_execution_test.js
          node TESTS/capture_capacity_runtime_routing_test.js
          node TESTS/capture_capacity_source_bootstrap_test.js
          node TESTS/capture_capacity_orion_signal_bridge_test.js
          node TESTS/capture_capacity_public_web_signal_test.js
          node TESTS/capture_capacity_production_loop_test.js
          node TESTS/capture_capacity_production_entrypoint_test.js

      - name: Single-owner runtime regressions
        run: |
          node TESTS/single_taskqueue_executor_test.js
          node TESTS/single_coo_planner_test.js

      - name: Runtime stability contract regression
        run: node TESTS/full_runtime_stability_test.js
