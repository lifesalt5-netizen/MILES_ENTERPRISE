name: MONICA CI

on:
  pull_request:
    paths:
      - 'SERVICES/monica/**'
      - 'CONFIG/MONICA/**'
      - 'CONFIG/WORKFORCE/MONICA_WORKFORCE_PROFILE.json'
      - 'SCRIPTS/RegisterMonicaTwin.js'
      - 'SCRIPTS/RunMonicaNetNewAcquisitionCensus.js'
      - 'SCRIPTS/InstallMonicaStandalone.js'
      - 'TESTS/Test_MonicaAcquisitionIntelligence.js'
      - 'TESTS/Test_MonicaWorkforceIntegration.js'
      - 'TESTS/Test_MonicaCensusContract.js'
      - 'TESTS/Test_MonicaSourceRegistry.js'
      - 'TESTS/Test_MonicaDiscoveryAssessment.js'
      - 'TESTS/Test_MonicaDiscoveryCandidateService.js'
      - 'MONICA.md'
      - '.github/workflows/monica-ci.yml'
  push:
    branches:
      - feature/monica-acquisition-intelligence
      - parallel/monica-assessment-20260822
    paths:
      - 'SERVICES/monica/**'
      - 'CONFIG/MONICA/**'
      - 'SCRIPTS/RegisterMonicaTwin.js'
      - 'SCRIPTS/RunMonicaNetNewAcquisitionCensus.js'
      - 'SCRIPTS/InstallMonicaStandalone.js'
      - 'TESTS/Test_MonicaAcquisitionIntelligence.js'
      - 'TESTS/Test_MonicaWorkforceIntegration.js'
      - 'TESTS/Test_MonicaCensusContract.js'
      - 'TESTS/Test_MonicaSourceRegistry.js'
      - 'TESTS/Test_MonicaDiscoveryAssessment.js'
      - 'TESTS/Test_MonicaDiscoveryCandidateService.js'
      - '.github/workflows/monica-ci.yml'

jobs:
  monica-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax validation
        run: |
          node --check SERVICES/monica/MonicaAcquisitionIntelligenceService.js
          node --check SERVICES/monica/MonicaDiscoveryCandidateService.js
          node --check SCRIPTS/RegisterMonicaTwin.js
          node --check SCRIPTS/RunMonicaNetNewAcquisitionCensus.js
          node --check SCRIPTS/InstallMonicaStandalone.js
          node --check TESTS/Test_MonicaWorkforceIntegration.js
          node --check TESTS/Test_MonicaCensusContract.js
          node --check TESTS/Test_MonicaSourceRegistry.js
          node --check TESTS/Test_MonicaDiscoveryAssessment.js
          node --check TESTS/Test_MonicaDiscoveryCandidateService.js
      - name: MONICA unit and suppression tests
        run: node TESTS/Test_MonicaAcquisitionIntelligence.js
      - name: MONICA census output contract
        run: node TESTS/Test_MonicaCensusContract.js
      - name: MONICA source registry safety contract
        run: node TESTS/Test_MonicaSourceRegistry.js
      - name: MONICA discovery assessment safety contract
        run: node TESTS/Test_MonicaDiscoveryAssessment.js
      - name: MONICA discovery candidate normalization contract
        run: node TESTS/Test_MonicaDiscoveryCandidateService.js
      - name: Register MONICA in canonical workforce registry
        run: node SCRIPTS/RegisterMonicaTwin.js
      - name: WorkforceService capability resolution
        run: node TESTS/Test_MonicaWorkforceIntegration.js
