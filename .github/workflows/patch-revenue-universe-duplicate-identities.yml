name: Patch Revenue Universe Duplicate Identities

on:
  push:
    branches:
      - fix/revenue-universe-duplicate-identities-20260901
    paths:
      - '.github/workflows/patch-revenue-universe-duplicate-identities.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revenue-universe-duplicate-identities-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply bounded duplicate identity patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('SERVICES/revenue/RevenueUniverseReconciliationService.js')
          text = p.read_text(encoding='utf-8')

          anchor = 'function q(identifier) { return `"${String(identifier).replace(/"/g, \'""\')}"`; }\n'
          helper = anchor + '''function identityKeyFor({ uei, cage, companyNorm, ordinal }) {\n  const normalizedUei = upper(uei);\n  const normalizedCage = upper(cage);\n  const normalizedCompany = normalizeName(companyNorm);\n  if (normalizedUei) return `UEI:${normalizedUei}`;\n  if (normalizedCage) return `CAGE:${normalizedCage}`;\n  if (normalizedCompany) return `NAME:${normalizedCompany}`;\n  return `ROW:${Number(ordinal || 0)}`;\n}\n'''
          if 'function identityKeyFor(' not in text:
              if anchor not in text: raise SystemExit('IDENTITY_HELPER_ANCHOR_MISSING')
              text = text.replace(anchor, helper, 1)

          anchor = '      let ordinal = 0;\n      const tx = output.transaction(rows => { for (const row of rows) insert.run(row); });\n'
          replacement = '      let ordinal = 0;\n      const seenIdentityKeys = new Set();\n      const tx = output.transaction(rows => { for (const row of rows) insert.run(row); });\n'
          if 'const seenIdentityKeys = new Set();' not in text:
              if anchor not in text: raise SystemExit('SEEN_SET_ANCHOR_MISSING')
              text = text.replace(anchor, replacement, 1)

          anchor = '        const uei = upper(row.uei), cage = upper(row.cage), company = clean(row.company), companyNorm = normalizeName(company), domain = domainFromValue(row.website);\n        const current = '
          replacement = '''        const uei = upper(row.uei), cage = upper(row.cage), company = clean(row.company), companyNorm = normalizeName(company), domain = domainFromValue(row.website);\n        const identityKey = identityKeyFor({ uei, cage, companyNorm, ordinal });\n        const duplicateIdentity = seenIdentityKeys.has(identityKey);\n        if (!duplicateIdentity) seenIdentityKeys.add(identityKey);\n        const current = '''
          if 'const duplicateIdentity = seenIdentityKeys.has(identityKey);' not in text:
              if anchor not in text: raise SystemExit('LOOP_IDENTITY_ANCHOR_MISSING')
              text = text.replace(anchor, replacement, 1)

          anchor = '        if (current) {\n          matchedCurrentMaster += 1;\n'
          replacement = '''        if (duplicateIdentity) {\n          disposition = "DUPLICATE_MERGED_ENTITY";\n          nextAction = "MERGE_WITH_CANONICAL_CONTRACTOR_IDENTITY";\n        } else if (current) {\n          matchedCurrentMaster += 1;\n'''
          if 'disposition = "DUPLICATE_MERGED_ENTITY";' not in text:
              if anchor not in text: raise SystemExit('DISPOSITION_ANCHOR_MISSING')
              text = text.replace(anchor, replacement, 1)

          anchor = '        const key = uei || cage || `${companyNorm || "contractor"}#${ordinal}`;\n'
          replacement = '        const key = `${identityKey}#ROW:${ordinal}`;\n'
          if anchor in text:
              text = text.replace(anchor, replacement, 1)
          elif replacement not in text:
              raise SystemExit('ROW_KEY_ANCHOR_MISSING')

          anchor = '          evidence: JSON.stringify({ currentMaster: Boolean(current), currentSamQualified: currentSam, fy2026AwardEvidence: awardEvidence })\n'
          replacement = '          evidence: JSON.stringify({ canonicalIdentityKey: identityKey, duplicateIdentity, currentMaster: Boolean(current), currentSamQualified: currentSam, fy2026AwardEvidence: awardEvidence })\n'
          if 'canonicalIdentityKey: identityKey' not in text:
              if anchor not in text: raise SystemExit('EVIDENCE_ANCHOR_MISSING')
              text = text.replace(anchor, replacement, 1)

          anchor = '          accountedContractors: accounted,\n          currentMasterRows: master.rows.length,\n'
          replacement = '          accountedContractors: accounted,\n          canonicalContractorIdentities: seenIdentityKeys.size,\n          duplicateIdentityRows: counts.DUPLICATE_MERGED_ENTITY || 0,\n          currentMasterRows: master.rows.length,\n'
          if 'canonicalContractorIdentities: seenIdentityKeys.size' not in text:
              if anchor not in text: raise SystemExit('UNIVERSE_COUNT_ANCHOR_MISSING')
              text = text.replace(anchor, replacement, 1)

          anchor = 'module.exports.RevenueUniverseReconciliationService = RevenueUniverseReconciliationService;\n'
          replacement = anchor + 'module.exports.identityKeyFor = identityKeyFor;\n'
          if 'module.exports.identityKeyFor = identityKeyFor;' not in text:
              if anchor not in text: raise SystemExit('EXPORT_ANCHOR_MISSING')
              text = text.replace(anchor, replacement, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Add duplicate identity regression
        run: |
          cat > TESTS/Test_RevenueUniverseDuplicateIdentityAccounting.js <<'NODE'
          "use strict";
          const assert = require("assert");
          const service = require("../SERVICES/revenue/RevenueUniverseReconciliationService");
          const key = service.identityKeyFor;
          assert.strictEqual(typeof key, "function");
          assert.strictEqual(key({ uei: " abc123 ", cage: "C1", companyNorm: "Acme", ordinal: 1 }), "UEI:ABC123");
          assert.strictEqual(key({ uei: "ABC123", cage: "C2", companyNorm: "Different", ordinal: 2 }), "UEI:ABC123");
          assert.strictEqual(key({ uei: "", cage: " c1 ", companyNorm: "Acme", ordinal: 3 }), "CAGE:C1");
          assert.strictEqual(key({ uei: "", cage: "", companyNorm: "Acme, Inc.", ordinal: 4 }), "NAME:acme inc");
          assert.strictEqual(key({ uei: "", cage: "", companyNorm: "", ordinal: 5 }), "ROW:5");
          const identity = key({ uei: "ABC123", cage: "", companyNorm: "Acme", ordinal: 1 });
          assert.notStrictEqual(`${identity}#ROW:1`, `${identity}#ROW:2`);
          console.log("REVENUE_UNIVERSE_DUPLICATE_IDENTITY_ACCOUNTING_TEST: GREEN");
          NODE
      - name: Validate
        run: |
          node --check SERVICES/revenue/RevenueUniverseReconciliationService.js
          node --check TESTS/Test_RevenueUniverseDuplicateIdentityAccounting.js
          node TESTS/Test_RevenueUniverseDuplicateIdentityAccounting.js
          node TESTS/Test_RevenueUniverseMissionRouting.js
      - name: Commit repair
        run: |
          git config user.name 'MILES Revenue Reconciliation Bot'
          git config user.email 'miles-revenue-reconciliation@users.noreply.github.com'
          git add SERVICES/revenue/RevenueUniverseReconciliationService.js TESTS/Test_RevenueUniverseDuplicateIdentityAccounting.js
          git commit -m 'Account for duplicate contractor identities explicitly'
          git push origin HEAD:fix/revenue-universe-duplicate-identities-20260901
