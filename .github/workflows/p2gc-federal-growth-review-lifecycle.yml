name: P2GC Federal Growth Review Lifecycle

on:
  push:
    paths:
      - 'CONFIG/P2GC_FEDERAL_GROWTH_REVIEW_PRODUCT_CONTRACT.json'
      - 'CONNECTORS/IONOS/smtp_governed.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewLifecycleService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewAccessService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewVerificationService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewScriptService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewBuilderService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewVideoProviderService.js'
      - 'SERVICES/revenue/P2GCGoogleVidsSegmentPlannerService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewCloseBriefService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewCommercialHandoffService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewHttpController.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewAdminController.js'
      - 'SERVICES/review/public/**'
      - 'StartP2GCCustomerDelivery.js'
      - 'TESTS/p2gc_federal_growth_review_lifecycle.test.js'
      - 'TESTS/p2gc_federal_growth_review_access.test.js'
      - 'TESTS/p2gc_federal_growth_review_verification.test.js'
      - 'TESTS/p2gc_federal_growth_review_script.test.js'
      - 'TESTS/p2gc_federal_growth_review_builder.test.js'
      - 'TESTS/p2gc_federal_growth_review_video_provider.test.js'
      - 'TESTS/p2gc_google_vids_segment_planner.test.js'
      - 'TESTS/p2gc_federal_growth_review_close_brief.test.js'
      - 'TESTS/p2gc_federal_growth_review_commercial_handoff.test.js'
      - 'TESTS/p2gc_federal_growth_review_admin.test.js'
      - 'TESTS/ionos_smtp_response_buffer.test.js'
      - '.github/workflows/p2gc-federal-growth-review-lifecycle.yml'
  pull_request:
    paths:
      - 'CONFIG/P2GC_FEDERAL_GROWTH_REVIEW_PRODUCT_CONTRACT.json'
      - 'CONNECTORS/IONOS/smtp_governed.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewLifecycleService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewAccessService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewVerificationService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewScriptService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewBuilderService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewVideoProviderService.js'
      - 'SERVICES/revenue/P2GCGoogleVidsSegmentPlannerService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewCloseBriefService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewCommercialHandoffService.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewHttpController.js'
      - 'SERVICES/revenue/P2GCFederalGrowthReviewAdminController.js'
      - 'SERVICES/review/public/**'
      - 'StartP2GCCustomerDelivery.js'
      - 'TESTS/p2gc_federal_growth_review_lifecycle.test.js'
      - 'TESTS/p2gc_federal_growth_review_access.test.js'
      - 'TESTS/p2gc_federal_growth_review_verification.test.js'
      - 'TESTS/p2gc_federal_growth_review_script.test.js'
      - 'TESTS/p2gc_federal_growth_review_builder.test.js'
      - 'TESTS/p2gc_federal_growth_review_video_provider.test.js'
      - 'TESTS/p2gc_google_vids_segment_planner.test.js'
      - 'TESTS/p2gc_federal_growth_review_close_brief.test.js'
      - 'TESTS/p2gc_federal_growth_review_commercial_handoff.test.js'
      - 'TESTS/p2gc_federal_growth_review_admin.test.js'
      - 'TESTS/ionos_smtp_response_buffer.test.js'

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check lifecycle service
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewLifecycleService.js
      - name: Syntax check secure access service
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewAccessService.js
      - name: Syntax check recipient verification service
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewVerificationService.js
      - name: Syntax check script service
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewScriptService.js
      - name: Syntax check builder service
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewBuilderService.js
      - name: Syntax check video provider service
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewVideoProviderService.js
      - name: Syntax check Google Vids segment planner
        run: node --check SERVICES/revenue/P2GCGoogleVidsSegmentPlannerService.js
      - name: Syntax check Kevin close brief service
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewCloseBriefService.js
      - name: Syntax check commercial handoff service
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewCommercialHandoffService.js
      - name: Syntax check review HTTP controller
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewHttpController.js
      - name: Syntax check private admin controller
        run: node --check SERVICES/revenue/P2GCFederalGrowthReviewAdminController.js
      - name: Syntax check customer delivery runtime
        run: node --check StartP2GCCustomerDelivery.js
      - name: Syntax check review client
        run: node --check SERVICES/review/public/review.js
      - name: Syntax check governed IONOS sender
        run: node --check CONNECTORS/IONOS/smtp_governed.js
      - name: Verify product contract JSON
        run: node -e "const c=require('./CONFIG/P2GC_FEDERAL_GROWTH_REVIEW_PRODUCT_CONTRACT.json'); if(c.greenDefinition.partialTechnicalSuccessIsGreen!==false) process.exit(2); if(!c.greenDefinition.requiredStages.includes('REVENUE_ATTRIBUTION')) process.exit(2); if(c.security.downloadable!==false) process.exit(2); console.log('P2GC_PRODUCT_CONTRACT_GREEN')"
      - name: Run lifecycle regression
        run: node TESTS/p2gc_federal_growth_review_lifecycle.test.js
      - name: Run secure access regression
        run: node TESTS/p2gc_federal_growth_review_access.test.js
      - name: Run recipient verification regression
        run: node TESTS/p2gc_federal_growth_review_verification.test.js
      - name: Run personalized script regression
        run: node TESTS/p2gc_federal_growth_review_script.test.js
      - name: Run automatic review builder regression
        run: node TESTS/p2gc_federal_growth_review_builder.test.js
      - name: Run video provider regression
        run: node TESTS/p2gc_federal_growth_review_video_provider.test.js
      - name: Run Google Vids segment planner regression
        run: node TESTS/p2gc_google_vids_segment_planner.test.js
      - name: Run Kevin close brief regression
        run: node TESTS/p2gc_federal_growth_review_close_brief.test.js
      - name: Run commercial handoff regression
        run: node TESTS/p2gc_federal_growth_review_commercial_handoff.test.js
      - name: Run private admin control regression
        run: node TESTS/p2gc_federal_growth_review_admin.test.js
      - name: Run IONOS SMTP response buffer regression
        run: node TESTS/ionos_smtp_response_buffer.test.js
