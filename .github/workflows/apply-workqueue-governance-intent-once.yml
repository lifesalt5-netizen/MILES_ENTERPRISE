name: Apply WorkQueue Governance Intent Once
on:
  push:
    branches:
      - 'fix/workqueue-governance-intent-20260830'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workqueue-governance-intent-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dry run repair
        run: node SCRIPTS/RepairWorkQueueGovernanceIntent.js
      - name: Apply repair
        run: node SCRIPTS/RepairWorkQueueGovernanceIntent.js --apply
      - name: Validate
        run: |
          node --check SERVICES/WorkQueueService.js
          node TESTS/workqueue_governance_intent.test.js
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SERVICES/WorkQueueService.js
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Use action intent for WorkQueue CEO escalation'
            git push origin HEAD:fix/workqueue-governance-intent-20260830
          fi
