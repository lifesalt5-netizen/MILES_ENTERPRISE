name: Apply COO Self Maintenance Autonomy Once

on:
  push:
    branches:
      - 'fix/coo-self-maintenance-autonomy-20260829'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coo-self-maintenance-autonomy-20260829
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check consolidated repair
        run: node --check SCRIPTS/RepairCOOSelfMaintenanceAutonomyV2.js
      - name: Dry run consolidated repair
        run: node SCRIPTS/RepairCOOSelfMaintenanceAutonomyV2.js
      - name: Apply consolidated repair
        run: node SCRIPTS/RepairCOOSelfMaintenanceAutonomyV2.js --apply
      - name: Validate production JavaScript
        run: |
          node --check SERVICES/CommandIntentPlannerService.js
          node --check SERVICES/CapabilityDispatcherService.js
          node --check SERVICES/governance/PolicyEngineService.js
          node --check SERVICES/SelfMaintenanceService.js
      - name: Verify autonomy markers
        run: |
          grep -q 'SELF_MAINTENANCE_RECONCILE_RUNTIME_APPROVALS' SERVICES/CommandIntentPlannerService.js
          grep -q 'GOVERNED_SELF_MAINTENANCE' SERVICES/governance/PolicyEngineService.js
          grep -q 'auditRuntimeApprovals()' SERVICES/SelfMaintenanceService.js
          grep -q 'reconcileRuntimeApprovals()' SERVICES/SelfMaintenanceService.js
          grep -q 'approvalsGranted: 0' SERVICES/SelfMaintenanceService.js
          grep -q 'tasksResumed: 0' SERVICES/SelfMaintenanceService.js
      - name: Commit repaired production source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SERVICES/CommandIntentPlannerService.js SERVICES/CapabilityDispatcherService.js SERVICES/governance/PolicyEngineService.js SERVICES/SelfMaintenanceService.js
          if git diff --cached --quiet; then
            echo 'No production source changes required.'
          else
            git commit -m 'Enable bounded COO self-maintenance autonomy'
            git push origin HEAD:fix/coo-self-maintenance-autonomy-20260829
          fi
