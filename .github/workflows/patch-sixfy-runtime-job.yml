name: Patch Six-FY Runtime Job

on:
  push:
    branches:
      - feat/sixfy-normalizer-runtime-job-20260902
    paths:
      - '.github/workflows/patch-sixfy-runtime-job.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sixfy-normalizer-runtime-job-20260902
          fetch-depth: 0
      - name: Apply bounded patch
        shell: python
        run: |
          from pathlib import Path

          bridge = Path('StartMilesRemoteExecutionBridge.js')
          text = bridge.read_text(encoding='utf-8')
          old = "  FY2026_AWARDED_UNIVERSE_COVERAGE: ['node', ['SCRIPTS/RunFy2026AwardedUniverseCoverage.js']],\n"
          new = old + "  SIX_FY_AWARDED_UNIVERSE_NORMALIZE: ['node', ['SCRIPTS/RunSixFiscalYearAwardUniverseNormalization.js']],\n"
          if text.count(old) != 1:
              raise SystemExit('bridge insertion anchor mismatch')
          bridge.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('TESTS/remote_execution_bridge_safety.test.js')
          text = test.read_text(encoding='utf-8')
          old = "  'SAM_SQLITE_EMAIL_RECOVERY'\n]);"
          new = "  'SAM_SQLITE_EMAIL_RECOVERY',\n  'SIX_FY_AWARDED_UNIVERSE_NORMALIZE'\n]);"
          if text.count(old) != 1:
              raise SystemExit('job-list anchor mismatch')
          text = text.replace(old, new, 1)
          old = "assert.deepStrictEqual(bridge.JOBS.FY2026_AWARDED_UNIVERSE_COVERAGE, ['node', ['SCRIPTS/RunFy2026AwardedUniverseCoverage.js']]);\n"
          new = old + "assert.deepStrictEqual(bridge.JOBS.SIX_FY_AWARDED_UNIVERSE_NORMALIZE, ['node', ['SCRIPTS/RunSixFiscalYearAwardUniverseNormalization.js']]);\n"
          if text.count(old) != 1:
              raise SystemExit('job assertion anchor mismatch')
          text = text.replace(old, new, 1)
          old = "assert.strictEqual(bridge.validateDirective({id:'x',enabled:true,job:'FY2026_AWARDED_UNIVERSE_COVERAGE'}).ok, true);\n"
          new = old + "assert.strictEqual(bridge.validateDirective({id:'x',enabled:true,job:'SIX_FY_AWARDED_UNIVERSE_NORMALIZE'}).ok, true);\n"
          if text.count(old) != 1:
              raise SystemExit('validate assertion anchor mismatch')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Verify bounded diff
        run: |
          git diff --check
          node --check StartMilesRemoteExecutionBridge.js
          node --check TESTS/remote_execution_bridge_safety.test.js
          git diff -- StartMilesRemoteExecutionBridge.js TESTS/remote_execution_bridge_safety.test.js
      - name: Commit patch
        run: |
          git config user.name "miles-ci-bot"
          git config user.email "miles-ci-bot@users.noreply.github.com"
          git add StartMilesRemoteExecutionBridge.js TESTS/remote_execution_bridge_safety.test.js
          git commit -m "Allowlist six-FY awarded universe normalization"
          git push origin HEAD:feat/sixfy-normalizer-runtime-job-20260902
