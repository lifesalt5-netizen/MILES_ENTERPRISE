name: Instantly Google OAuth Zero-Cost Sender Validation

on:
  pull_request:
    paths:
      - 'SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js'
      - 'TESTS/instantly_google_oauth_zero_cost_sender.test.js'
      - '.github/workflows/instantly-google-oauth-zero-cost-sender-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: node --check SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js
      - name: Safety regression
        run: node TESTS/instantly_google_oauth_zero_cost_sender.test.js
      - name: Static no-secret/no-cost contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "AUTHORIZE_ZERO_COST_PAID_SENDER_GOOGLE_OAUTH" SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js
          grep -q "newGoogleWorkspaceLicenseAuthorized: false" SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js
          grep -q "aliasesCountAsIndependentSenders: false" SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js
          ! grep -q "imap_password" SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js
          ! grep -q "smtp_password" SCRIPTS/RunInstantlyGoogleOAuthZeroCostSender.js
