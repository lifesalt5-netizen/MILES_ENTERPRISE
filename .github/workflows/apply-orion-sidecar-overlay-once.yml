name: Apply ORION Sidecar Overlay Once

on:
  push:
    branches:
      - 'feat/orion-sidecar-overlay-read-20260830'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-sidecar-overlay-read-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate sources
        run: |
          node --check SERVICES/orion/OrionSidecarOverlayService.js
          node --check SCRIPTS/RepairOrionConnectorSidecarOverlay.js
          node TESTS/orion_sidecar_overlay.test.js
          node SCRIPTS/RepairOrionConnectorSidecarOverlay.js
      - name: Apply guarded connector repair
        run: node SCRIPTS/RepairOrionConnectorSidecarOverlay.js --apply
      - name: Validate connector
        run: |
          node --check CONNECTORS/ORION/connector.js
          grep -Fq 'OrionSidecarOverlayService' CONNECTORS/ORION/connector.js
          grep -Fq 'enrichContractors' CONNECTORS/ORION/connector.js
          echo ORION_SIDECAR_OVERLAY_SOURCE_PASS
      - name: Commit connector repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONNECTORS/ORION/connector.js
          if git diff --cached --quiet; then
            echo 'No connector changes required.'
          else
            git commit -m 'Overlay current contract facts onto ORION contractors'
            git push origin HEAD:feat/orion-sidecar-overlay-read-20260830
          fi
