name: Apply ORION Component Freshness Once

on:
  push:
    branches:
      - 'feat/orion-component-freshness-sidecar-read-20260830'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orion-component-freshness-sidecar-read-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate sources
        run: |
          node --check SERVICES/orion/OrionComponentFreshnessService.js
          node --check SCRIPTS/RepairOrionProviderComponentFreshness.js
          node TESTS/orion_component_freshness.test.js
          node SCRIPTS/RepairOrionProviderComponentFreshness.js
      - name: Apply guarded provider repair
        run: node SCRIPTS/RepairOrionProviderComponentFreshness.js --apply
      - name: Validate patched provider
        run: |
          node --check PROVIDERS/providers/OrionProvider.js
          grep -Fq 'componentFreshness' PROVIDERS/providers/OrionProvider.js
          grep -Fq 'database mtime' PROVIDERS/providers/OrionProvider.js
          echo ORION_COMPONENT_FRESHNESS_SOURCE_PASS
      - name: Commit provider repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROVIDERS/providers/OrionProvider.js
          if git diff --cached --quiet; then
            echo 'No provider changes required.'
          else
            git commit -m 'Report ORION component-level freshness'
            git push origin HEAD:feat/orion-component-freshness-sidecar-read-20260830
          fi
