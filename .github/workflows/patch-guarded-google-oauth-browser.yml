name: Patch Guarded Google OAuth Browser Job

on:
  push:
    branches:
      - feat/miles-google-oauth-browser-guarded-20260902

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/miles-google-oauth-browser-guarded-20260902
          fetch-depth: 0
      - name: Patch bridge and safety contract
        shell: python
        run: |
          from pathlib import Path
          bridge = Path('StartMilesRemoteExecutionBridge.js')
          text = bridge.read_text(encoding='utf-8')
          anchor = "  INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING: ['node', ['SCRIPTS/RunInstantlyGoogleOAuthZeroCostMissingBatch.js', '--authorization', 'AUTHORIZE_ZERO_COST_PAID_SENDER_GOOGLE_OAUTH']],\n"
          addition = "  INSTANTLY_ZERO_COST_OAUTH_BROWSER_GUARDED: ['node', ['SCRIPTS/RunInstantlyGoogleOAuthBrowserGuarded.js', '--authorization', 'AUTHORIZE_EXISTING_AUTHENTICATED_GOOGLE_OAUTH_CONSENT']],\n"
          if addition not in text:
              if anchor not in text: raise SystemExit('BRIDGE_ANCHOR_NOT_FOUND')
              text = text.replace(anchor, anchor + addition, 1)
          bridge.write_text(text, encoding='utf-8')

          test = Path('TESTS/remote_execution_bridge_safety.test.js')
          text = test.read_text(encoding='utf-8')
          anchor = "assert.deepStrictEqual(bridge.JOBS.INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING, ['node', ['SCRIPTS/RunInstantlyGoogleOAuthZeroCostMissingBatch.js', '--authorization', 'AUTHORIZE_ZERO_COST_PAID_SENDER_GOOGLE_OAUTH']]);\n"
          addition = "assert.deepStrictEqual(bridge.JOBS.INSTANTLY_ZERO_COST_OAUTH_BROWSER_GUARDED, ['node', ['SCRIPTS/RunInstantlyGoogleOAuthBrowserGuarded.js', '--authorization', 'AUTHORIZE_EXISTING_AUTHENTICATED_GOOGLE_OAUTH_CONSENT']]);\n"
          if addition not in text:
              if anchor not in text: raise SystemExit('TEST_ANCHOR_NOT_FOUND')
              text = text.replace(anchor, anchor + addition, 1)
          test.write_text(text, encoding='utf-8')
      - name: Syntax check and commit
        run: |
          node --check SCRIPTS/RunInstantlyGoogleOAuthBrowserGuarded.js
          node --check StartMilesRemoteExecutionBridge.js
          node --check TESTS/instantly_google_oauth_browser_guarded.test.js
          git config user.name "MILES GitHub Automation"
          git config user.email "miles-github-automation@local.invalid"
          git add StartMilesRemoteExecutionBridge.js TESTS/remote_execution_bridge_safety.test.js
          git commit -m "Allowlist guarded Miles Google OAuth browser job"
          git push origin HEAD:feat/miles-google-oauth-browser-guarded-20260902
