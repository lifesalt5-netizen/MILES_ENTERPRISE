name: Instantly Google OAuth Browser Guarded Validation

on:
  pull_request:
    paths:
      - 'SCRIPTS/RunInstantlyGoogleOAuthBrowserGuarded.js'
      - 'TESTS/instantly_google_oauth_browser_guarded.test.js'
      - 'StartMilesRemoteExecutionBridge.js'
      - 'TESTS/remote_execution_bridge_safety.test.js'
      - '.github/workflows/instantly-google-oauth-browser-guarded-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'SCRIPTS/RunInstantlyGoogleOAuthBrowserGuarded.js'
      - 'TESTS/instantly_google_oauth_browser_guarded.test.js'
      - 'StartMilesRemoteExecutionBridge.js'
      - 'TESTS/remote_execution_bridge_safety.test.js'
      - '.github/workflows/instantly-google-oauth-browser-guarded-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check SCRIPTS/RunInstantlyGoogleOAuthBrowserGuarded.js
          node --check StartMilesRemoteExecutionBridge.js
      - name: Guarded OAuth safety regression
        run: node TESTS/instantly_google_oauth_browser_guarded.test.js
      - name: Remote bridge fixed-job safety
        run: node TESTS/remote_execution_bridge_safety.test.js
