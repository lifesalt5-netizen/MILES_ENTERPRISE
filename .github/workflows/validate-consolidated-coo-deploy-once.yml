name: Validate Consolidated COO Deploy Once

on:
  push:
    branches:
      - 'fix/coo-self-maintenance-autonomy-20260829'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coo-self-maintenance-autonomy-20260829
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check deploy helper
        run: node --check SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
      - name: Verify fail-closed and safety markers
        run: |
          grep -q "Port 8787 PID" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -q "miles-command-center" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -q "miles-worker" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -q "miles-autonomous-coo" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -q "APPROVALS_GRANTED_BY_MAINTENANCE=0" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -q "TASKS_RESUMED_BY_MAINTENANCE=0" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -q "TASKS_DELETED_BY_MAINTENANCE=0" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
          grep -q "COO_CONSOLIDATED_DEPLOY_GREEN" SCRIPTS/DeployConsolidatedCOOSelfMaintenance.js
      - name: Run self-maintenance autonomy regression
        run: node TESTS/self_maintenance_autonomy_regression.test.js
      - name: Run Command Center integrity contracts
        run: |
          node TESTS/Test_CommandCenterRuntimeIntegrityRepair.js
          node TESTS/Test_CommandCenterRuntimeIntegrityApply.js
          node TESTS/policy_approval_intent_regression.test.js
