name: Patch Guarded OAuth Allowlist Order

on:
  push:
    branches:
      - feat/miles-google-oauth-browser-guarded-20260902

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/miles-google-oauth-browser-guarded-20260902
          fetch-depth: 0
      - name: Fix expected sorted allowlist order
        shell: python
        run: |
          from pathlib import Path
          p = Path('TESTS/remote_execution_bridge_safety.test.js')
          text = p.read_text(encoding='utf-8')
          old = "  'INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING',\n  'INSTANTLY_ZERO_COST_OAUTH_BROWSER_GUARDED',\n"
          new = "  'INSTANTLY_ZERO_COST_OAUTH_BROWSER_GUARDED',\n  'INSTANTLY_ZERO_COST_OAUTH_INIT_MISSING',\n"
          if old not in text: raise SystemExit('SORT_ORDER_NEEDLE_NOT_FOUND')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit exact ordering fix
        run: |
          git config user.name "MILES GitHub Automation"
          git config user.email "miles-github-automation@local.invalid"
          git add TESTS/remote_execution_bridge_safety.test.js
          git commit -m "Fix guarded OAuth allowlist expected order"
          git push origin HEAD:feat/miles-google-oauth-browser-guarded-20260902
