name: Oneoff Post Restart Source Patch

on:
  push:
    branches:
      - fix/post-restart-truth-closeout-20260901

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[post-restart-source-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-restart-truth-closeout-20260901
          fetch-depth: 0
      - name: Apply bounded source repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'PATCH_ANCHOR_NOT_FOUND:{path}:{old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Protected-action matching must not match SEND inside SENDING.
          replace_once(
              'SERVICES/governance/PolicyEngineService.js',
              '''function escapeRegExp(value) {
            return String(value || "").replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");
          }
          ''',
              '''function escapeRegExp(value) {
            return String(value || "").replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");
          }

          function matchStructuredApprovalPattern(text, patterns = []) {
            const normalizedText = normalize(text);
            return patterns.find(pattern => {
              const token = normalize(pattern);
              if (!token) return false;
              const escaped = escapeRegExp(token);
              return new RegExp(`(^|[^A-Z0-9])${escaped}([^A-Z0-9]|$)`).test(normalizedText);
            }) || null;
          }
          ''')
          replace_once(
              'SERVICES/governance/PolicyEngineService.js',
              '    const structuredApprovalPattern = matchPattern(structured, approvals.approvalPatterns);',
              '    const structuredApprovalPattern = matchStructuredApprovalPattern(structured, approvals.approvalPatterns);')

          # Never omit a current CEO approval merely because it is older than the newest 50 history rows.
          replace_once(
              'SERVICES/digital_coo/MilesCommandCenter.js',
              '''function dashboardOperationSnapshot() {
          ''',
              '''function isPendingApprovalOperation(operation) {
            return operation && ['AWAITING_APPROVAL', 'WAITING_FOR_CEO_APPROVAL', 'AWAITING_CEO_APPROVAL']
              .includes(String(operation.status || '').trim().toUpperCase());
          }

          function dashboardOperations(operations = [], limit = 50) {
            const rows = Array.isArray(operations) ? operations : [];
            const pending = rows.filter(isPendingApprovalOperation);
            const pendingRefs = new Set(pending);
            const recent = rows.slice(0, Math.max(1, Number(limit) || 50)).filter(row => !pendingRefs.has(row));
            return [...pending, ...recent].slice(0, Math.max(Math.max(1, Number(limit) || 50), pending.length));
          }

          function dashboardOperationSnapshot() {
          ''')
          replace_once(
              'SERVICES/digital_coo/MilesCommandCenter.js',
              '''    const queue = queueState();
              return {
                operations: queue.operations.slice(0, 50),
          ''',
              '''    const queue = queueState();
              const operations = dashboardOperations(queue.operations, 50);
              return {
                operations,
          ''')
          replace_once(
              'SERVICES/digital_coo/MilesCommandCenter.js',
              '''        displayed: Math.min(50, queue.operations.length),
                fileBytes: stat.size,
                historyOmitted: false
          ''',
              '''        displayed: operations.length,
                pendingApprovalCount: queue.operations.filter(isPendingApprovalOperation).length,
                pendingApprovalsAlwaysIncluded: true,
                fileBytes: stat.size,
                historyOmitted: false
          ''')

          # Do not turn a stale ORION A-code plus expired/invalid expiration into contradictory ACTIVE vs false state.
          replace_once(
              'SERVICES/demo/ExecutiveGrowthBlueprintDemoService.js',
              '''    const expiration = company.expirationDate || pick(raw,["expiration_date","sam_expiration_date"]);
              const samActive = /^(A|ACTIVE|Y|YES|TRUE|1)$/i.test(clean(company.entityStatus || pick(raw,["sam_status","entity_status"]))) && (!expiration || new Date(expiration) >= new Date());
              const gsa = vehicles.some(v => /GSA|MAS|MULTIPLE AWARD SCHEDULE/i.test(v));
          ''',
              '''    const expiration = company.expirationDate || pick(raw,["expiration_date","sam_expiration_date"]);
              const samSourceStatus = clean(company.entityStatus || pick(raw,["sam_status","entity_status"]));
              const samAffirmative = /^(A|ACTIVE|Y|YES|TRUE|1)$/i.test(samSourceStatus);
              const samExplicitInactive = /^(INACTIVE|EXPIRED|N|NO|FALSE|0)$/i.test(samSourceStatus);
              const expirationDate = expiration ? new Date(expiration) : null;
              const expirationValid = !expirationDate || !Number.isNaN(expirationDate.getTime());
              const expirationCurrent = !expirationDate || (expirationValid && expirationDate >= new Date());
              const samActive = samAffirmative && expirationCurrent;
              const samRegistrationState = samActive ? true : samExplicitInactive ? false : null;
              const samDisplayStatus = samActive ? "ACTIVE" : samExplicitInactive ? "INACTIVE" : "UNVERIFIED";
              const gsa = vehicles.some(v => /GSA|MAS|MULTIPLE AWARD SCHEDULE/i.test(v));
          ''')
          replace_once(
              'SERVICES/demo/ExecutiveGrowthBlueprintDemoService.js',
              '''      samStatus:samActive ? "ACTIVE" : (company.entityStatus || "UNVERIFIED"),
          ''',
              '''      samStatus:samDisplayStatus,
          ''')
          replace_once(
              'SERVICES/demo/ExecutiveGrowthBlueprintDemoService.js',
              '''      samRegistration:samActive,
          ''',
              '''      samRegistration:samRegistrationState,
          ''')

          # Add validated USAspending historical identity fallback and current-SAM enrichment for every resolved UEI.
          replace_once(
              'StartP2GCGrowthBlueprintDemo.js',
              '''const SamQualifiedProspectFallbackService = require("./SERVICES/demo/SamQualifiedProspectFallbackService");
          ''',
              '''const SamQualifiedProspectFallbackService = require("./SERVICES/demo/SamQualifiedProspectFallbackService");
          const HistoricalProspectFallbackService = require("./SERVICES/demo/HistoricalProspectFallbackService");
          ''')
          replace_once(
              'StartP2GCGrowthBlueprintDemo.js',
              '''const samFallback = new SamQualifiedProspectFallbackService({ rootDir: ROOT });
          ''',
              '''const samFallback = new SamQualifiedProspectFallbackService({ rootDir: ROOT });
          const historicalFallback = new HistoricalProspectFallbackService({ rootDir: ROOT });
          ''')
          replace_once(
              'StartP2GCGrowthBlueprintDemo.js',
              '''    if (fallback?.ok) baseModel = fallback;
              else {
                baseModel = {
                  ...baseModel,
                  fallback: {
                    attempted: true,
                    service: fallback?.service || "P2GC_SAM_QUALIFIED_PROSPECT_FALLBACK",
                    status: fallback?.status || "SAM_FALLBACK_UNAVAILABLE",
                    source: fallback?.source || null,
                    candidateCount: fallback?.candidateCount ?? null
                  }
                };
              }
            }

            const model = commercialPreview.apply(truthReconciler.reconcile(baseModel));
          ''',
              '''    if (fallback?.ok) baseModel = fallback;
              else baseModel = historicalFallback.build(term, { samFallback: fallback, orionFailure: baseModel });
            }

            if (baseModel?.ok && baseModel.profile?.uei) {
              const currentSam = samFallback.build(baseModel.profile.uei);
              const resolvedUei = String(baseModel.profile.uei || '').trim().toUpperCase();
              const samUei = String(currentSam?.profile?.uei || '').trim().toUpperCase();
              if (currentSam?.ok === true && resolvedUei && samUei === resolvedUei) {
                baseModel = {
                  ...baseModel,
                  profile: {
                    ...(baseModel.profile || {}),
                    cage: baseModel.profile?.cage || currentSam.profile?.cage || null,
                    website: baseModel.profile?.website || currentSam.profile?.website || null,
                    samStatus: 'ACTIVE'
                  },
                  currentState: {
                    ...(baseModel.currentState || {}),
                    samRegistration: true
                  },
                  evidence: {
                    ...(baseModel.evidence || {}),
                    currentSamRegistration: currentSam.evidence?.identity || null
                  }
                };
              }
            }

            const model = commercialPreview.apply(truthReconciler.reconcile(baseModel));
          ''')
          PY

          git diff --check
          node --check SERVICES/governance/PolicyEngineService.js
          node --check SERVICES/digital_coo/MilesCommandCenter.js
          node --check SERVICES/demo/ExecutiveGrowthBlueprintDemoService.js
          node --check SERVICES/demo/HistoricalProspectFallbackService.js
          node --check StartP2GCGrowthBlueprintDemo.js

          git config user.name "MILES Repair Bot"
          git config user.email "miles-repair@users.noreply.github.com"
          git add SERVICES/governance/PolicyEngineService.js SERVICES/digital_coo/MilesCommandCenter.js SERVICES/demo/ExecutiveGrowthBlueprintDemoService.js StartP2GCGrowthBlueprintDemo.js
          git commit -m "Fix post-restart truth and approval surfaces [post-restart-source-patch-applied]"
          git push origin HEAD:fix/post-restart-truth-closeout-20260901
