name: Apply SAM Bulk Refresh Once
on:
  push:
    branches:
      - 'fix/sam-bulk-extract-refresh-20260830'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sam-bulk-extract-refresh-20260830
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dry run bridge repair
        run: node SCRIPTS/RepairSamBulkRemoteAllowlist.js
      - name: Apply bridge repair
        run: node SCRIPTS/RepairSamBulkRemoteAllowlist.js --apply
      - name: Validate source
        run: |
          node --check SERVICES/orion/FederalSourceReadinessAuditService.js
          node --check SERVICES/orion/SamBulkExtractAcquisitionService.js
          node --check SCRIPTS/AcquireSamBulkExtractsToStaging.js
          node --check StartMilesRemoteExecutionBridge.js
          node TESTS/sam_bulk_refresh_strategy.test.js
      - name: Commit repaired bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add StartMilesRemoteExecutionBridge.js
          if git diff --cached --quiet; then
            echo 'No bridge source change required.'
          else
            git commit -m 'Allowlist SAM bulk extract staging acquisition'
            git push origin HEAD:fix/sam-bulk-extract-refresh-20260830
          fi
