name: P2GC Win-Back Validation

on:
  pull_request:
    paths:
      - "DATA/revenue/winback/**"
      - "SERVICES/revenue/WinBackProspectReconstructionService.js"
      - "SERVICES/revenue/WinBackCampaignService.js"
      - "SERVICES/revenue/WinBackCampaignCrossGenService.js"
      - "SERVICES/revenue/WinBackLocalHistoryDiscoveryService.js"
      - "SERVICES/revenue/WinBackMasterExportService.js"
      - "SERVICES/revenue/WinBackProductionLoopService.js"
      - "SERVICES/marketing/P2GCEmailMessagingStandard.js"
      - "SCRIPTS/ExtractWinBackXlsx.ps1"
      - "RUN_P2GC_WINBACK_CAMPAIGN.js"
      - "StartAutonomousCOO.js"
      - "TESTS/winback_*"
      - ".github/workflows/winback-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax validation
        run: |
          node --check SERVICES/revenue/WinBackProspectReconstructionService.js
          node --check SERVICES/revenue/WinBackCampaignService.js
          node --check SERVICES/revenue/WinBackCampaignCrossGenService.js
          node --check SERVICES/revenue/WinBackLocalHistoryDiscoveryService.js
          node --check SERVICES/revenue/WinBackMasterExportService.js
          node --check SERVICES/revenue/WinBackProductionLoopService.js
          node --check SERVICES/marketing/P2GCEmailMessagingStandard.js
          node --check RUN_P2GC_WINBACK_CAMPAIGN.js
          node --check StartAutonomousCOO.js
          node --check TESTS/winback_reconstruction_test.js
          node --check TESTS/winback_campaign_test.js
          node --check TESTS/winback_local_history_test.js
          node --check TESTS/winback_crossgen_messaging_test.js
          node --check TESTS/winback_master_export_test.js
          node --check TESTS/winback_production_loop_test.js
          node --check TESTS/winback_production_entrypoint_test.js

      - name: Prospect reconstruction tests
        run: node TESTS/winback_reconstruction_test.js

      - name: Local B12 and Obsidian history recovery tests
        run: node TESTS/winback_local_history_test.js

      - name: Cross-generational messaging standard tests
        run: node TESTS/winback_crossgen_messaging_test.js

      - name: Master and review export tests
        run: node TESTS/winback_master_export_test.js

      - name: Production sidecar tests
        run: node TESTS/winback_production_loop_test.js

      - name: Production entrypoint tests
        run: node TESTS/winback_production_entrypoint_test.js

      - name: Campaign safety and sequence tests
        run: node TESTS/winback_campaign_test.js
