name: Post Soak Closeout Safety

on:
  pull_request:
    paths:
      - 'RUN_P2GC_DUE_NURTURE_CLOSEOUT.js'
      - 'SCRIPTS/ExecuteDueNurtureCloseout.ps1'
      - 'EXECUTE_DUE_NURTURE_CLOSEOUT.cmd'
      - 'CONNECTORS/WEBSITE_B12/B12_AUTH_BOOTSTRAP.js'
      - 'CONNECTORS/WEBSITE_B12/B12_AUTH_AND_STAGE_SINGLE_SESSION.js'
      - 'CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V3.js'
      - 'CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V4.js'
      - 'CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V5.js'
      - 'CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V6.js'
      - 'CONNECTORS/WEBSITE_B12/RUN_CONTROLLED_PUBLISH_V2.ps1'
      - 'CONNECTORS/WEBSITE_B12/modules/session.js'
      - 'SCRIPTS/B12AuthenticateAndStage.ps1'
      - 'B12_AUTHENTICATE_AND_STAGE.cmd'
      - 'TESTS/Test_PostSoakCloseoutSafety.js'
      - '.github/workflows/post-soak-closeout-safety.yml'
  workflow_dispatch:

jobs:
  node-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check RUN_P2GC_DUE_NURTURE_CLOSEOUT.js
          node --check CONNECTORS/WEBSITE_B12/B12_AUTH_BOOTSTRAP.js
          node --check CONNECTORS/WEBSITE_B12/B12_AUTH_AND_STAGE_SINGLE_SESSION.js
          node --check CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V3.js
          node --check CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V4.js
          node --check CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V5.js
          node --check CONNECTORS/WEBSITE_B12/B12_CONTROLLED_PUBLISHER_V6.js
          node --check CONNECTORS/WEBSITE_B12/modules/session.js
      - name: Static safety contract
        run: node TESTS/Test_PostSoakCloseoutSafety.js

  windows-powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'SCRIPTS\ExecuteDueNurtureCloseout.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List *; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'SCRIPTS\B12AuthenticateAndStage.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List *; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'CONNECTORS\WEBSITE_B12\RUN_CONTROLLED_PUBLISH_V2.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List *; exit 1 }
          Write-Host 'POST_SOAK_CLOSEOUT_POWERSHELL51_SYNTAX=GREEN'
